    <p class="sub">Древо роли: в центре вы, ветки — компетенции должности, листья — навыки. Закрашенный лист
     подтверждён, пустой с красным контуром ушёл в трек, серый не проверялся. Наведите на лист — покажет навык.</p>
    <div class="treecard">${tree()}
      <div class="tleg"><span><i class="legring full"></i>пройдено целиком</span>
        <span><i class="legring half"></i>дуга — доля подтверждённых навыков</span>
        <span><i class="legring lock">${ic('lock', 9)}</i>требование ещё не закрыто</span>
        <span>нажмите на узел — откроется компетенция</span></div></div>
    <div class="pcard" style="margin-top:16px">${rows}</div>
    <div class="grid2cols">
      <div class="pbox"><div class="lbl">В треке</div>
        <p>${left.length ? left.map(t => esc(t.title)).join(', ') : 'Все уроки пройдены.'}</p>
        <div class="row">${left.length ? `<div class="btn act" data-lesson="${left[0].id}">Продолжить трек</div>` : `<div class="btn sec act" data-go="lib">К курсам</div>`}</div></div>
      <div class="pbox"><div class="lbl">Не проверялось</div>
        <p>Два навыка: шаг с записью экрана остался непройденным. Это не пробел — просто нет данных.</p>
        <div class="row"><div class="btn sec act" data-go="start">Доответить</div></div></div>
    </div></div>`;
}

/* ---------- сборка и события ---------- */
const PAGES = { lib, start, diag, result, lesson, matrix, profile, comps, comp: compPage, role: rolePage };
function render() {
  const inner = (PAGES[S.route] || lib)();
  const wrapped = ['diag', 'lesson', 'result'].includes(S.route) ? inner
    : `<div class="content"><div class="colwrap">${inner}</div></div>`;
  $('#app').innerHTML = `<div class="ui">${side()}<div class="main">${topbar()}<div class="body">${wrapped}</div></div></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-opt],[data-send],[data-next],[data-start],[data-why],[data-rec],[data-none],[data-lstep],[data-lcheck],[data-lesson],[data-comp],[data-role]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { if (d.go === 'start') S.started = true; return go(d.go); }
  if (d.start) { S.si = 0; S.phase = 'ask'; S.sel = []; S.why = ''; S.rec = null; return go('diag'); }
  if (d.comp) { S.compCode = d.comp; return go('comp'); }
  if (d.role) { S.roleName = d.role; return go('role'); }
  if (d.lesson) { S.lesson = 0; S.sel = []; S.lessonDone = false; S.lessonId = d.lesson; return go('lesson'); }
  if (d.opt !== undefined) {
    const i = +d.opt, st = DATA.steps[S.si];
    const multi = S.route === 'diag' && (st.kind === 'm' || st.kind === 'i');
    if (multi) S.sel = S.sel.includes(i) ? S.sel.filter(x => x !== i) : S.sel.concat(i);
    else S.sel = [i];
    return render();
  }
  if (d.why) { S.why = 'Отбирал по пунктам брифа: стиль без фотографий, свободная полоса под заголовок и то, что кадр работает и в А3, и в посте. Критерии выписал до генерации.'; return render(); }
  if (d.rec === 'go') { S.rec = 'go'; render(); setTimeout(() => { S.rec = 'done'; render(); }, 1600); return; }
  if (d.rec === 'stop') { S.rec = 'done'; return render(); }
  if (d.none) { S.rec = 'none'; S.phase = 'res'; return render(); }
  if (d.send) {
    const st = DATA.steps[S.si];
    if (st.kind !== 'star' && !S.sel.length) return;
    const right = st.kind === 'i' ? st.shots.every((sh, i) => sh.pick === S.sel.includes(i))
      : st.kind === 'star' ? true : st.opts.every((o, i) => o.ok === S.sel.includes(i));
    S.done[S.si] = right;
    S.phase = 'res'; return render();
  }
  if (d.next) {
    if (S.si + 1 >= DATA.steps.length) { S.levels.G = 2; return go('result'); }
    S.si++; S.phase = 'ask'; S.sel = []; S.why = ''; S.rec = null; return render();
  }
  if (d.lstep) { S.lesson = +d.lstep; S.sel = []; return render(); }
  if (d.lcheck) {
    if (!S.sel.length) return;
    const ok = DATA.unit.check.opts[S.sel[0]].g >= 4;
    S.lesson = 6; if (ok) { S.lessonDone = true; S.closed[S.lessonId || 'G13'] = true; }
    return render();
  }
});
render();
</script></body></html>
