<script>const DATA={"role": "Графический дизайнер", "comps": [{"code": "B", "name": "Промптинг и проверка ответов", "thr": 2, "id": 1}, {"code": "G", "name": "Генерация изображений по брифу", "thr": 2, "id": 9}, {"code": "K", "name": "Пакеты макетов и презентаций", "thr": 2, "id": 10}, {"code": "F", "name": "Правка и печать изображений", "thr": 3, "id": 20}], "steps": [{"kind": "m", "id": "G01", "comp": "G", "compName": "Генерация изображений по брифу", "skill": "Знает, какие материалы нельзя загружать во внешние генераторы — брендбук, незапущенные креативы, чужие работы, — и какой контур для них разрешён; материал вне разрешённого контура не загружает, а спрашивает руководителя", "q": "Вы готовите визуалы к приёмной кампании и собираетесь работать во внешнем генераторе изображений. Что из перечисленного можно туда загрузить или вставить в запрос? Отметьте всё подходящее.", "fb": "Во внешний генератор можно отдать то, что и так не закрыто и принадлежит вам: описание стиля словами и свой набросок без логотипа. Брендбук и незапущенные креативы — внутренние материалы, чужая иллюстрация — чужие права, а фото студентов — изображения людей, которые не давали согласия на загрузку в сторонний сервис.", "ok_fb": "Верно: наружу уходят только описание стиля словами и собственные наброски без закрытых элементов.", "opts": [{"t": "PDF брендбука университета: логотипы, сетка, правила вёрстки", "ok": false}, {"t": "Описание стиля словами: «белый фон, красный акцент, крупная геометрия»", "ok": true}, {"t": "Макет кампании «Приём-2027», которая стартует только через месяц", "ok": false}, {"t": "Иллюстрацию чужого автора с Behance с просьбой «сделай так же»", "ok": false}, {"t": "Свой набросок композиции от руки — без логотипа и без текстов", "ok": true}, {"t": "Фото студентов со съёмки Дня открытых дверей — чтобы заменить фон", "ok": false}]}, {"kind": "m", "id": "G11", "comp": "G", "compName": "Генерация изображений по брифу", "skill": "Знает, что изображение узнаваемого человека — и «похожего на» — нельзя генерировать и публиковать без согласия, и куда идти за согласием; без согласия работу не начинает и возвращает задачу автору брифа", "q": "К приёмной кампании вы готовите визуалы с людьми — часть с генерацией, часть с обработкой фото. Какие из действий допустимы? Отметьте всё подходящее.", "fb": "Допустимы три действия: собирательный образ с проверкой на сходство, работа с фото человека, который подписал согласие, и оформление согласия у юристов до генерации. Публичность ректора согласия не заменяет, «похожая на актрису» героиня — это та же узнаваемость, только без имени, а открытый профиль в соцсети не даёт права использовать лицо в ролике. Правило одно: узнаваемого человека — и «похожего на» — не генерируем и не публикуем без его согласия.", "ok_fb": "Верно: человек на визуале — либо собирательный образ без сходства, либо тот, кто дал согласие; за формой согласия идут к юристам до начала работы.", "opts": [{"t": "Сгенерировать собирательного «студента» для обложки буклета и проверить, что он не похож на реального человека", "ok": true}, {"t": "Сгенерировать ректора в скафандре для поздравления ко Дню космонавтики: он человек публичный, ему будет приятно", "ok": false}, {"t": "Сделать героиню афиши «похожей на известную актрису»: имя в запросе не называть, только типаж и причёску", "ok": false}, {"t": "Обработать в разрешённом контуре фото выпускницы, которая подписала согласие на использование изображения в рекламе", "ok": true}, {"t": "Взять фото первокурсника из его открытого профиля в соцсети и «оживить» для ролика о посвящении в студенты", "ok": false}, {"t": "До генерации визуала с преподавателем взять у юристов форму согласия и подписать её с ним на эту кампанию", "ok": true}]}, {"kind": "i", "id": "G04", "comp": "G", "compName": "Генерация изображений по брифу", "skill": "Генерирует не меньше трёх разных вариантов и отбирает их по критериям, названным до генерации: пункты брифа, место под текст, носители", "q": "Бриф студенческого офиса: афиша хакатона «Код города» 14–15 ноября. Белый фон, красный акцент, крупная геометрия, без фотографий; носители — А3 и пост в соцсети; заголовок верстается сверху, поэтому надписей на картинке быть не должно. Генератор выдал четыре варианта. Отметьте те, которые понесёте арт-директору.", "fb": "Арт-директору идут А и Г: оба держат стиль, оставляют место под заголовок и работают на А3 и в посте. Б отпадает по брифу — просили без фотографий, В заняла надписью место под заголовок. В обосновании важно назвать пункты брифа, по которым отбирали, и то, что они названы до генерации: иначе отбор превращается в «нравится — не нравится».", "ok_fb": "Отобраны оба варианта, которые проходят по брифу, и названо, по каким его пунктам шёл отбор.", "shots": [{"id": "А", "alt": "Крупные красные дуги на белом, верхняя треть кадра пустая, композиция держится и в вертикали", "pick": true, "note": "бриф выполнен, место под заголовок есть", "look": {"bg": "white", "fig": "geom", "acc": "#ED131C"}}, {"id": "Б", "alt": "Фотореалистичная сцена: студенты за ноутбуками в тёплом свете, лица в кадре", "pick": false, "note": "бриф просил без фотографий", "look": {"bg": "sand", "fig": "people", "acc": "#c9833a"}}, {"id": "В", "alt": "Крупная геометрия в фирменном красном, но в центре вписана надпись «Хакатон» чужим шрифтом", "pick": false, "note": "надпись заняла место, куда встаёт заголовок", "look": {"bg": "white", "fig": "sign", "acc": "#ED131C"}}, {"id": "Г", "alt": "Белая плоскость, красная диагональная сетка, свободная полоса сверху, по краям запас под обрез А3", "pick": true, "note": "работает на обоих носителях", "look": {"bg": "white", "fig": "card", "acc": "#ED131C"}}], "why_q": "По каким пунктам брифа вы отбирали и когда эти пункты назвали? Одной-двумя фразами."}, {"kind": "c", "id": "G13", "comp": "G", "compName": "Генерация изображений по брифу", "skill": "Перед публикацией сверяется с правилом компании и требованиями площадки и ставит пометку «создано с ИИ» штатным инструментом там, где она требуется", "q": "Для анонса Дня открытых дверей вы сгенерировали реалистичную картинку: абитуриенты с родителями в холле главного корпуса, выглядит как репортажное фото. Менеджер по соцсетям просит опубликовать её сегодня в VK и на видеоплощадке — «как есть, без лишних плашек». Что делаете?", "fb": "", "ok_fb": "", "opts": [{"t": "Публикую как есть: пометка для авторов дело добровольное, а картинка — всего лишь иллюстрация к анонсу, претензий к ней не будет", "ok": false, "fb": "Для авторов пометка и правда добровольна, но у площадок бывают свои требования к реалистичному ИИ-контенту, и у компании есть своё правило. Стоит свериться с ними до публикации."}, {"t": "Сверяюсь с правилом компании и требованиями площадок, ставлю пометку штатным инструментом, в подписи не выдаю картинку за фото с события", "ok": true, "fb": "Решение принято до публикации и по правилам: реалистичный ИИ-контент раскрыт штатным инструментом площадки, а подпись не обещает абитуриентам репортаж, которого не было."}, {"t": "Дописываю в самом конце подписи мелкий хэштег про ИИ, а штатную пометку площадки не включаю — формально раскрытие в посте уже есть", "ok": false, "fb": "Намерение раскрыть — верное, но хэштег в конце подписи площадка не считывает и читатель не замечает. Надёжнее штатный инструмент пометки: его видят и аудитория, и модерация."}, {"t": "Вычищаю из файла метаданные о генерации, чтобы площадка не поставила пометку сама и пост смотрелся живым, как настоящий репортаж", "ok": false, "fb": "Так реалистичная генерация выдаётся за репортаж, а раскрытие намеренно обходится. Когда это заметят, под вопросом окажется доверие ко всем фото приёмной кампании."}], "why_q": "Почему? Одной фразой — важно объяснение, а не угадывание."}, {"kind": "star", "comp": "G", "compName": "Генерация изображений по брифу", "about": "делали визуал по брифу генерацией — от запроса до выпуска", "frame": [["Что было", "проект или задача, срок, кто ждал результат"], ["Что нужно было сделать", "ваша часть работы в этой истории"], ["Что делали вы", "по шагам: чем пользовались, что решали сами, с чем шли к коллегам"], ["Чем закончилось", "что получилось, как проверяли, что сделали бы иначе"]], "sample": "В августе мы запускали анонсы магистратуры в соцсетях факультета: восемь карточек, по две на программу, размер 1080×1350, их ждал SMM-отдел к пятнице. Бриф был короткий: белый фон, красный акцент, крупная геометрия, без фотографий, заголовок верстается сверху.\nГотового шаблона под такие анонсы у нас не было, я собирал всё с нуля. Сначала выписал из брифа, по чему буду отбирать: стиль, свободная полоса под заголовок и то, что картинка должна читаться и в ленте, и в сторис. Потом написал запрос в генератор из таблицы отдела — описал сцену, палитру кодами и то, чего в кадре быть не должно, — и сделал по три разных варианта на каждую программу.\nОтбирал я по тем же пунктам: два отпали, потому что надпись легла внутрь картинки, ещё один — из-за лица на втором плане, которое могло оказаться узнаваемым. Отобранное показал арт-директору, а потом проверил по брендбуку: оттенок красного взял пипеткой и подтянул в макете, шрифт заголовка поправил на фирменный, логотип отодвинул от края.\nПеред сдачей я положил рядом с исходниками досье: чем генерировал, на каком тарифе, сами запросы и что доделывал руками. Пометку об ИИ поставил штатным инструментом площадки, в подписи не называл картинку фотографией. В итоге восемь карточек ушли в SMM в четверг, правок не было.", "marks": {"1": ["случай рассказан как рабочий: задача, срок, кто ждал результат", "названо, по какому образцу или правилу работали", "сказано, с кем сверялись и кому отдавали на проверку", "рассказ про генерацию визуала по брифу"], "2": ["готового решения не было — задачу поставили себе сами", "названы собственные действия по шагам", "есть конкретика: числа, объёмы, даты", "сказано, как проверяли результат до сдачи", "сказано, чем всё закончилось"], "3": ["названы пути, между которыми выбирали", "признак выбора назван до результата", "решение обосновано сроком или ценой ошибки", "сказано, что из этого стало правилом"]}, "level": 2, "fallback": {"situation": "Факультет дизайна проводит конференцию «Городские среды» 14 ноября, анонсы идут в соцсетях факультета. Вам нужны три фоновых изображения под анонс: пост 1080×1350, шапка сообщества 1600×400 и сторис 1080×1920. По брендбуку мероприятия работают два цвета — глубокий синий и песочный, из форм разрешены крупные дуги и плашки, людей и лиц в кадре нет, а заголовок верстается поверх изображения, то есть надписей на картинке быть не должно. Съёмки и покупки стоков в этот раз не будет, бюджет закрыт, остаётся генерация. Площадка требует пометку, если изображение сделано ИИ. Файлы ждут в SMM сегодня к 18:00, у вас три часа.", "ask": "Пришлите одним сообщением текст запроса в генератор изображений — тот, который отправите, вместе с тем, что к нему приложите. Рассказ о порядке работы не нужен."}}], "unit": {"id": "G13", "title": "Помечать ли «создано с ИИ»", "min": 8, "skill": "Перед публикацией сверяется с правилом компании и требованиями площадки и ставит пометку «создано с ИИ» штатным инструментом там, где она требуется", "comp": "G", "task": "Для анонса дня открытых дверей сгенерирована реалистичная картинка: абитуриенты с родителями в холле главного корпуса, выглядит как репортажный снимок. Менеджер по соцсетям просит опубликовать сегодня «как есть, без лишних плашек».", "why": "Пометка нужна не для отчётности, а чтобы картинка не выдавала себя за съёмку события. Правило складывается из двух частей: что требует компания и что требует площадка, — у них разные механики, и хэштег в конце подписи штатную пометку не заменяет. Отдельный риск — подпись: «кадры со дня открытых дверей» под генерацией вводит в заблуждение даже с пометкой.", "algo": ["Спросите себя, может ли человек принять эту картинку за снимок события.", "Сверьтесь с правилом компании и требованиями площадки: пометку ставят штатным инструментом площадки.", "Поправьте подпись: иллюстрацию к анонсу не называют кадрами с события.", "Метаданные о генерации не вычищайте: площадки их читают, а снятая пометка — это уже сокрытие."], "practice": "Возьмите свой пост с генерацией и проверьте две вещи: стоит ли штатная пометка и что говорит подпись. Отправьте текст подписи в Synergy Chat и спросите: «Можно ли принять это за снимок события и что поправить?»", "check": {"q": "Реалистичная генерация уходит в анонс, площадка требует пометку, в подписи написано «кадры со дня открытых дверей».", "opts": [{"t": "Ставлю штатную пометку площадки и меняю подпись: это иллюстрация к анонсу, а не кадры с события", "g": 5, "fb": "Верно: закрыты обе части — механика площадки и смысл подписи."}, {"t": "Ставлю пометку, подпись оставляю: пометка уже всё объясняет", "g": 3, "fb": "Пометка говорит «сделано с ИИ», а подпись продолжает утверждать, что событие снято. Противоречие остаётся."}, {"t": "Дописываю мелкий хэштег про ИИ в конце подписи, штатную пометку не включаю", "g": 1, "fb": "Требование площадки закрывается её инструментом. Хэштег в конце текста его не заменяет."}]}}, "track": [{"id": "G13", "title": "Помечать ли «создано с ИИ»", "min": 8, "skill": "Перед публикацией сверяется с правилом компании и требованиями площадки и ставит пометку «создано с ИИ» штатным инструментом там, где она требуется", "comp": "G"}, {"id": "F09", "title": "Что нельзя загружать в сервис правки", "min": 5, "skill": "Знает, какие исходники нельзя загружать в сервисы правки и апскейла: неанонсированные материалы, чужие работы, фото людей без согласия; материал вне списка не загружает, а спрашивает руководителя", "comp": "F"}, {"id": "G15", "title": "Бракуем нейросетевой шаблон", "min": 9, "skill": "Бракует варианты с приметами шаблонной генерации — глянцевая кожа, неон, места, которых нет у компании, — по заранее названным критериям и объясняет причину брака тому, кто заказал визуал", "comp": "G"}], "matrix": {"roles": [{"name": "SMM-дизайнер", "short": "SMM", "core": 10}, {"name": "Веб-дизайнер", "short": "Веб", "core": 11}, {"name": "Видео/моушен-дизайнер", "short": "Видео", "core": 15}, {"name": "Графический дизайнер", "short": "График", "core": 20}, {"name": "Продуктовый дизайнер", "short": "Продукт", "core": 11}, {"name": "Средовой (3D) дизайнер", "short": "Среда", "core": 21}], "comps": [{"name": "Промптинг и проверка ответов", "id": 1, "lv": [2, 2, 2, 2, 2, 2]}, {"name": "Генерация изображений по брифу", "id": 9, "lv": [2, 2, 0, 2, 0, 2]}, {"name": "Пакеты макетов и презентаций", "id": 10, "lv": [3, 1, 0, 2, 0, 2]}, {"name": "Прототипирование интерфейсов", "id": 11, "lv": [0, 3, 0, 0, 3, 0]}, {"name": "Сборка роликов из шаблона", "id": 13, "lv": [2, 0, 2, 0, 0, 0]}, {"name": "Генерация видео", "id": 14, "lv": [1, 0, 2, 0, 0, 0]}, {"name": "Анимация, озвучка и дубляж", "id": 15, "lv": [0, 0, 3, 0, 0, 0]}, {"name": "Анализ отзывов и интервью", "id": 16, "lv": [0, 0, 0, 0, 2, 0]}, {"name": "Правка и печать изображений", "id": 20, "lv": [2, 1, 0, 3, 0, 1]}, {"name": "Визуализация пространств", "id": 21, "lv": [0, 0, 0, 0, 0, 2]}]}, "tree": [{"code": "B", "name": "Промптинг и проверка ответов", "thr": 2, "atoms": [{"id": "B01", "text": "Пишет запрос по шаблону роли и заполняет все его поля: контекст, формат, ограничения, что проверить; нет нужного поля — шаблон не меняет, а спрашивает автора"}, {"id": "B02", "text": "По выданному списку проверяет допустимость данных и инструмента; запрещённые материалы во внешний сервис не отправляет, для материалов вне списка уточняет разрешение у руководителя"}, {"id": "B03", "text": "Проверяет ответ ИИ по чек-листу: сверяет каждую цифру, дату и ссылку с источником; расхождение сам не исправляет, а показывает руководителю"}, {"id": "B04", "text": "Берёт для работы с ИИ только задачи из списка своей роли и отдаёт результат на проверку; задачу вне списка не берёт, а спрашивает руководителя"}, {"id": "B05", "text": "Пишет запрос под типовую задачу из пяти частей: контекст, от кого и кому, формат, ограничения, что проверить"}, {"id": "B06", "text": "Получив неполный ответ, одним-двумя уточнениями называет, чего не хватает, что добавить, в каком формате и что сверить с источником, — не начиная заново"}, {"id": "B07", "text": "Перед использованием проверяет факты, цифры и ссылки и помечает, что проверено"}]}, {"code": "G", "name": "Генерация изображений по брифу", "thr": 2, "atoms": [{"id": "G01", "text": "Знает, какие материалы нельзя загружать во внешние генераторы — брендбук, незапущенные креативы, чужие работы, — и какой контур для них разрешён; материал вне разрешённого контура не загружает, а спрашивает руководителя"}, {"id": "G02", "text": "Проверяет сгенерированное по памятке о правах: тариф, сходство с чужим знаком, лицо человека; при совпадении в публикацию не отдаёт, а спрашивает руководителя"}, {"id": "G03", "text": "Формулирует запрос на концепт: стиль, композиция, образцы, ограничения — и дорабатывает его по результату"}, {"id": "G04", "text": "Генерирует не меньше трёх разных вариантов и отбирает их по критериям, названным до генерации: пункты брифа, место под текст, носители"}, {"id": "G05", "text": "Проверяет результат на соответствие брендбуку: цвета, шрифты, отступы, логотип"}, {"id": "G09", "text": "Запускает генерацию на модели из таблицы отдела с её настройками по умолчанию; задачу, которой в таблице нет, не подбирает сам, а спрашивает руководителя"}, {"id": "G10", "text": "Удерживает стиль, персонажа или продукт в серии изображений с помощью референсов — без «плавания» лица и фирменных деталей"}, {"id": "G11", "text": "Знает, что изображение узнаваемого человека — и «похожего на» — нельзя генерировать и публиковать без согласия, и куда идти за согласием; без согласия работу не начинает и возвращает задачу автору брифа"}, {"id": "G12", "text": "Сохраняет досье генерации вместе с исходниками: инструмент и версия, запрос, референсы, доля ручной доработки"}, {"id": "G13", "text": "Перед публикацией сверяется с правилом компании и требованиями площадки и ставит пометку «создано с ИИ» штатным инструментом там, где она требуется"}]}, {"code": "K", "name": "Пакеты макетов и презентаций", "thr": 2, "atoms": [{"id": "K01", "text": "Выполняет задачи из списка рутины отдела по инструкции: переименование слоёв, выгрузки, подборки; задачу вне списка не автоматизирует, а приносит руководителю"}, {"id": "K02", "text": "Ставит ИИ задачу на подборку референсов по брифу: сколько, как сгруппировать, пояснение к каждому, ограничения брифа, проверка источников и прав"}, {"id": "K03", "text": "Поручает ИИ переименовать слои по схеме имён и выгрузить файлы в нужных форматах и размерах: указывает, что не менять и не удалять, и просит список изменений на проверку"}, {"id": "K04", "text": "Собирает с ИИ пакет карточек по контент-плану из одного шаблона: задаёт число вариантов на пост, размер и имена файлов, запрещает менять тексты и шаблон, просит пометить спорные переносы"}, {"id": "K07", "text": "Собирает с ИИ связку «заголовок + текст + визуал» под публикацию так, что текст на изображении без ошибок и совпадает с подписью"}, {"id": "K08", "text": "Собирает презентацию с ИИ по тезисам и приводит её к фирменному шаблону: сетка, шрифты, одна мысль на слайд; проверяет факты и цифры"}]}, {"code": "F", "name": "Правка и печать изображений", "thr": 3, "atoms": [{"id": "F01", "text": "Проверяет изображение при 100% по списку артефактов и отмечает найденное: анатомия, текст, геометрия, тени; что переделывать, решает не сам, а спрашивает руководителя"}, {"id": "F02", "text": "Правит изображение по инструкции — убирает или заменяет объект, расширяет фон, меняет деталь — так, что правка не видна при 100% масштабе"}, {"id": "F03", "text": "Проверяет сгенерированное при 100% на артефакты: единичные исправляет по маске, вариант с артефактами сразу в нескольких зонах бракует"}, {"id": "F04", "text": "Готовит результат к выпуску по требованиям носителя: апскейл до нужного dpi, векторизация, цветовой профиль — и при 100% проверяет, что апскейл не дорисовал деталей"}, {"id": "F05", "text": "Готовит ИИ-изображение к печати: разрешение под формат, CMYK и профиль, вылеты, проверка на 100%"}, {"id": "F06", "text": "До передачи заказчику проверяет обратным поиском по изображению, нет ли сходства с известными персонажами, знаками и стоковыми изображениями; найденное перерабатывает"}, {"id": "F07", "text": "Разрабатывает айдентику с ИИ так, чтобы знак можно было зарегистрировать: генерацию берёт как эскиз, перестраивает знак вручную, фиксирует этапы и свой вклад"}, {"id": "F09", "text": "Знает, какие исходники нельзя загружать в сервисы правки и апскейла: неанонсированные материалы, чужие работы, фото людей без согласия; материал вне списка не загружает, а спрашивает руководителя"}]}], "levels": {"1": "По образцу", "2": "Самостоятельно", "3": "По ситуации", "4": "Для других"}, "lib": [{"code": "B", "name": "Промптинг и проверка ответов", "tagline": "Ставит ИИ задачу запросом из пяти частей, сверяет ответ с источником и отвечает за результат.", "how": "сотрудник пишет запрос из пяти частей: контекст, от кого и кому, формат, ограничения, что проверить. Если ответ неполный, одним-двумя уточнениями называет, чего не хватает, и не пишет запрос заново. Перед отправкой сверяет каждую цифру, дату и ссылку с первоисточником. Во внешние сервисы отправляет только публичное и обезличенное, остальное — только в разрешённые инструменты.", "top": 4, "who": "Нужна всем должностям модели. Требуемый уровень задаётся в описании роли.", "levels": {"1": "Пишет запрос по шаблону роли и проверяет ответ по чек-листу; результат показывает руководителю; данные вне списка разрешённых наружу не отправляет", "2": "Пишет запрос из пяти частей, дорабатывает ответ уточнением, сверяет цифры, даты и ссылки с источником", "3": "Находит ошибку в ответе, называет её причину и по цене ошибки решает, что поручить ИИ, а что сделать самому", "4": "Пишет для коллег шаблоны запросов и правила: что проверять, что нельзя передавать во внешние сервисы"}, "lines": [{"name": "Постановка задачи ИИ", "checks": "как собран запрос и как его дорабатывают до нужного ответа"}, {"name": "Проверка результата", "checks": "сверяет ли человек ответ с источником и находит ли ошибку"}, {"name": "Обращение с данными", "checks": "что не уходит во внешние сервисы и кто отвечает за результат"}, {"name": "Граница поручения", "checks": "какую часть задачи отдают ИИ, а какую делают сами"}], "atoms": [{"id": "B01", "level": 1, "line": "Постановка задачи ИИ", "anchor": false, "text": "Пишет запрос по шаблону роли и заполняет все его поля: контекст, формат, ограничения, что проверить; нет нужного поля — шаблон не меняет, а спрашивает автора", "artifact": false}, {"id": "B02", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "По выданному списку проверяет допустимость данных и инструмента; запрещённые материалы во внешний сервис не отправляет, для материалов вне списка уточняет разрешение у руководителя", "artifact": false}, {"id": "B03", "level": 1, "line": "Проверка результата", "anchor": false, "text": "Проверяет ответ ИИ по чек-листу: сверяет каждую цифру, дату и ссылку с источником; расхождение сам не исправляет, а показывает руководителю", "artifact": false}, {"id": "B04", "level": 1, "line": "Граница поручения", "anchor": false, "text": "Берёт для работы с ИИ только задачи из списка своей роли и отдаёт результат на проверку; задачу вне списка не берёт, а спрашивает руководителя", "artifact": false}, {"id": "B05", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Пишет запрос под типовую задачу из пяти частей: контекст, от кого и кому, формат, ограничения, что проверить", "artifact": false}, {"id": "B06", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Получив неполный ответ, одним-двумя уточнениями называет, чего не хватает, что добавить, в каком формате и что сверить с источником, — не начиная заново", "artifact": false}, {"id": "B07", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Перед использованием проверяет факты, цифры и ссылки и помечает, что проверено", "artifact": false}, {"id": "B08", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Находит в ответе фактическую ошибку и решает, что проверить руками, а что исправить в запросе", "artifact": false}, {"id": "B09", "level": 3, "line": "Граница поручения", "anchor": false, "text": "Решает, какую часть задачи отдавать ИИ, а какую нет, и объясняет решение через риск и цену ошибки", "artifact": false}, {"id": "B10", "level": 4, "line": "Постановка задачи ИИ", "anchor": false, "text": "Составляет для коллег шаблон запроса и инструкцию по повторяющейся задаче подразделения", "artifact": true}, {"id": "B11", "level": 4, "line": "Обращение с данными", "anchor": false, "text": "Формулирует для команды правила: что проверять, что не передавать, кто отвечает за результат", "artifact": true}], "roles": [{"name": "SMM-дизайнер", "thr": 2, "core": false}, {"name": "Веб-дизайнер", "thr": 2, "core": false}, {"name": "Видео/моушен-дизайнер", "thr": 2, "core": false}, {"name": "Графический дизайнер", "thr": 2, "core": false}, {"name": "Продуктовый дизайнер", "thr": 2, "core": false}, {"name": "Средовой (3D) дизайнер", "thr": 2, "core": false}]}, {"code": "G", "name": "Генерация изображений по брифу", "tagline": "Концепты и серии изображений по брифу: отбор по пунктам брифа, сверка с брендбуком, проверка прав и пометки.", "how": "дизайнер описывает задачу — стиль, композиция, образцы, ограничения — и получает варианты за минуты, а не за день. Например, из 10 вариантов отбирает 2–3 по пунктам брифа, держит героя и стиль серии по референсам, сверяет цвета, шрифты и логотип с брендбуком. Перед выпуском проверяет три вещи: тариф сервиса разрешает коммерческое использование, узнаваемых людей нет или есть их согласие, пометка «создано с ИИ» стоит там, где её требует площадка или правило компании.", "top": 4, "who": "Уровень для Middle: SMM-дизайнер — 2, Веб-дизайнер — 2, Графический дизайнер — 2, Средовой (3D) дизайнер — 2. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Запускает генерацию по брифу и таблице моделей отдела, проверяет результат по памятке о правах; материал вне разрешённого контура не загружает; спорный случай показывает руководителю", "2": "Пишет запрос на концепт по брифу, генерирует не меньше трёх вариантов и отбирает по пунктам брифа, держит героя в серии, сверяет с брендбуком, сохраняет досье генерации, ставит пометку по правилу площадки", "3": "Собирает цепочку генерации под форматы площадок, которую коллега повторяет по описанию; настраивает стилевую модель в разрешённом контуре; бракует варианты с приметами шаблонной генерации; решает, где нужна съёмка", "4": "Пишет для команды правила генерации: разрешённые сервисы, проверки перед выпуском, хранение досье генерации"}, "lines": [{"name": "Постановка задачи ИИ", "checks": "как собран запрос на изображение, референсы и цепочка генерации"}, {"name": "Проверка результата", "checks": "отбор и браковка вариантов, сверка с брендбуком, решение о съёмке"}, {"name": "Обращение с данными", "checks": "контур загрузки, права и согласие, пометка об ИИ, след генерации"}], "atoms": [{"id": "G01", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, какие материалы нельзя загружать во внешние генераторы — брендбук, незапущенные креативы, чужие работы, — и какой контур для них разрешён; материал вне разрешённого контура не загружает, а спрашивает руководителя", "artifact": false}, {"id": "G02", "level": 1, "line": "Проверка результата", "anchor": false, "text": "Проверяет сгенерированное по памятке о правах: тариф, сходство с чужим знаком, лицо человека; при совпадении в публикацию не отдаёт, а спрашивает руководителя", "artifact": false}, {"id": "G03", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Формулирует запрос на концепт: стиль, композиция, образцы, ограничения — и дорабатывает его по результату", "artifact": false}, {"id": "G04", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Генерирует не меньше трёх разных вариантов и отбирает их по критериям, названным до генерации: пункты брифа, место под текст, носители", "artifact": false}, {"id": "G05", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Проверяет результат на соответствие брендбуку: цвета, шрифты, отступы, логотип", "artifact": false}, {"id": "G06", "level": 3, "line": "Постановка задачи ИИ", "anchor": false, "text": "Собирает повторяемую цепочку — референс → генерация → правка → апскейл → форматы площадок — и передаёт её коллеге так, что она воспроизводится", "artifact": false}, {"id": "G07", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Решает, где хватит генерации, а где нужны ручной дизайн или съёмка: реальное место, людей и продукт компании показывает снимком", "artifact": false}, {"id": "G08", "level": 4, "line": "Обращение с данными", "anchor": false, "text": "Пишет для команды правила генерации: разрешённые сервисы и контур, проверки перед выпуском, где и как хранить досье генерации", "artifact": false}, {"id": "G09", "level": 1, "line": "Постановка задачи ИИ", "anchor": false, "text": "Запускает генерацию на модели из таблицы отдела с её настройками по умолчанию; задачу, которой в таблице нет, не подбирает сам, а спрашивает руководителя", "artifact": false}, {"id": "G10", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Удерживает стиль, персонажа или продукт в серии изображений с помощью референсов — без «плавания» лица и фирменных деталей", "artifact": false}, {"id": "G11", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, что изображение узнаваемого человека — и «похожего на» — нельзя генерировать и публиковать без согласия, и куда идти за согласием; без согласия работу не начинает и возвращает задачу автору брифа", "artifact": false}, {"id": "G12", "level": 2, "line": "Обращение с данными", "anchor": false, "text": "Сохраняет досье генерации вместе с исходниками: инструмент и версия, запрос, референсы, доля ручной доработки", "artifact": false}, {"id": "G13", "level": 2, "line": "Обращение с данными", "anchor": false, "text": "Перед публикацией сверяется с правилом компании и требованиями площадки и ставит пометку «создано с ИИ» штатным инструментом там, где она требуется", "artifact": false}, {"id": "G14", "level": 3, "line": "Постановка задачи ИИ", "anchor": false, "text": "Настраивает стилевую модель или набор референсов на разрешённых материалах компании — в разрешённом контуре — и проверяет, что серия проходит брендбук", "artifact": false}, {"id": "G15", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Бракует варианты с приметами шаблонной генерации — глянцевая кожа, неон, места, которых нет у компании, — по заранее названным критериям и объясняет причину брака тому, кто заказал визуал", "artifact": false}], "roles": [{"name": "SMM-дизайнер", "thr": 2, "core": false}, {"name": "Веб-дизайнер", "thr": 2, "core": false}, {"name": "Графический дизайнер", "thr": 2, "core": false}, {"name": "Средовой (3D) дизайнер", "thr": 2, "core": false}]}, {"code": "K", "name": "Пакеты макетов и презентаций", "tagline": "Массовые и повторяющиеся задачи: подборка референсов, переименование слоёв, выгрузка в нескольких размерах, пакеты карточек и презентации.", "how": "переименование 140 слоёв, выгрузку баннеров в четырёх размерах и раскладку файлов по папкам площадок ИИ делает по заданной схеме имён. Подборка из 15 референсов под бриф приходит с источником и пояснением к каждому. Задача, которая повторяется каждую неделю, записывается сценарием: шаги, схема имён, проверки. До отправки дизайнер просматривает весь пакет, а не первые десять файлов.", "top": 4, "who": "Уровень для Middle: SMM-дизайнер — 3, Графический дизайнер — 2, Средовой (3D) дизайнер — 2, Веб-дизайнер — 1. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Выполняет задачи из списка рутины отдела по инструкции к списку; результат отдаёт на проверку; задачу вне списка приносит руководителю", "2": "Ставит ИИ задачи: подборка по брифу, переименование слоёв и выгрузка, пакет карточек по контент-плану, презентация по тезисам в фирменном шаблоне. В каждой задаче указывает формат, ограничения и что проверить", "3": "Записывает повторяющуюся задачу как сценарий с шагами и проверками, сверяет первый прогон с ручным результатом. Если в пакете сбой, находит общую причину и правит шаблон", "4": "Ведёт библиотеку сценариев и шаблонов команды: что автоматизировано, как запускать, кто проверяет результат"}, "lines": [{"name": "Постановка задачи ИИ", "checks": "состав пакета, формат, схема имён и ограничения в задаче для ИИ"}, {"name": "Проверка результата", "checks": "просмотр всего пакета, совпадение текста и правка причины сбоя"}], "atoms": [{"id": "K01", "level": 1, "line": "Постановка задачи ИИ", "anchor": false, "text": "Выполняет задачи из списка рутины отдела по инструкции: переименование слоёв, выгрузки, подборки; задачу вне списка не автоматизирует, а приносит руководителю", "artifact": false}, {"id": "K02", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Ставит ИИ задачу на подборку референсов по брифу: сколько, как сгруппировать, пояснение к каждому, ограничения брифа, проверка источников и прав", "artifact": false}, {"id": "K03", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Поручает ИИ переименовать слои по схеме имён и выгрузить файлы в нужных форматах и размерах: указывает, что не менять и не удалять, и просит список изменений на проверку", "artifact": false}, {"id": "K04", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Собирает с ИИ пакет карточек по контент-плану из одного шаблона: задаёт число вариантов на пост, размер и имена файлов, запрещает менять тексты и шаблон, просит пометить спорные переносы", "artifact": false}, {"id": "K05", "level": 3, "line": "Постановка задачи ИИ", "anchor": false, "text": "Записывает повторяющуюся задачу как сценарий для ИИ — шаги, схема имён, проверки — и сверяет первый прогон с ручным результатом", "artifact": false}, {"id": "K06", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Перед передачей просматривает весь пакет от ИИ, а не выборку: находит общую причину сбоя (длинный текст, подмена шрифта), правит шаблон и перевыгружает затронутые файлы", "artifact": false}, {"id": "K07", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Собирает с ИИ связку «заголовок + текст + визуал» под публикацию так, что текст на изображении без ошибок и совпадает с подписью", "artifact": false}, {"id": "K08", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Собирает презентацию с ИИ по тезисам и приводит её к фирменному шаблону: сетка, шрифты, одна мысль на слайд; проверяет факты и цифры", "artifact": false}, {"id": "K09", "level": 4, "line": "Постановка задачи ИИ", "anchor": false, "text": "Ведёт для команды библиотеку сценариев и шаблонов: что автоматизировано, как запускать, кто проверяет результат", "artifact": true}], "roles": [{"name": "SMM-дизайнер", "thr": 3, "core": true}, {"name": "Веб-дизайнер", "thr": 1, "core": false}, {"name": "Графический дизайнер", "thr": 2, "core": false}, {"name": "Средовой (3D) дизайнер", "thr": 2, "core": false}]}, {"code": "R", "name": "Прототипирование интерфейсов", "tagline": "Кликабельные прототипы из компонентов дизайн-системы, тексты состояний экрана, проверка доступности, поведение ИИ-функций продукта.", "how": "первый вариант экрана собирается за час, а не за неделю. Это кликабельный прототип из компонентов дизайн-системы, а не из «похожих». Тексты для пустого состояния, загрузки и ошибки пишутся с ИИ в пределах заданной длины. Перед передачей в разработку макет сверяется с сеткой, шагом отступов и библиотекой компонентов и проверяется на контраст, размер зон нажатия и порядок фокуса.", "top": 4, "who": "Уровень для Middle: Веб-дизайнер — 3, Продуктовый дизайнер — 3. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Передаёт прототип разработке по чек-листу и помечает, что сделано ИИ; продуктовые материалы наружу не выносит; сроки по коду не называет, а передаёт вопрос руководителю", "2": "Собирает из компонентов дизайн-системы кликабельный прототип, который проходится от начала до конца. Пишет тексты состояний. Сверяет макет с дизайн-системой и проверяет доступность: контраст, зоны нажатия, фокус, альтернативные тексты", "3": "Подключает библиотеку компонентов к ИИ-инструменту. Проверяет гипотезу прототипом на пользователях и отделяет шаги, которые ИИ добавил сам. Описывает поведение ИИ-функции при ошибке модели. Адаптирует экран под телефон по данным о задачах пользователя", "4": "Пишет правила ИИ-прототипирования для команды: что генерируем, как сверяем с дизайн-системой, что передаём в разработку"}, "lines": [{"name": "Постановка задачи ИИ", "checks": "как собран прототип и на чём идёт генерация экранов"}, {"name": "Проверка результата", "checks": "сверка с дизайн-системой, доступность и отделение дорисованного ИИ"}, {"name": "Состояния и адаптация", "checks": "тексты состояний, поведение при ошибке модели, экран телефона"}, {"name": "Обращение с данными", "checks": "какие продуктовые материалы не выносят во внешние инструменты"}, {"name": "Передача и правила", "checks": "что передают в разработку и по каким правилам работает команда"}], "atoms": [{"id": "R01", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, какие продуктовые материалы не выносятся во внешние инструменты: незапущенные экраны, данные пользователей; такие материалы во внешние инструменты не загружает", "artifact": false}, {"id": "R02", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Собирает интерактивный прототип экрана по описанию задачи и пользователя — на компонентах дизайн-системы", "artifact": false}, {"id": "R03", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Генерирует два варианта компоновки одного экрана, которые отличаются одним решением, чтобы положить их рядом и сравнить на встрече", "artifact": false}, {"id": "R04", "level": 2, "line": "Состояния и адаптация", "anchor": false, "text": "Готовит тексты для состояний экрана — пустое, загрузка, ошибка: заголовок, пояснение и кнопка в пределах заданной длины", "artifact": false}, {"id": "R05", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Перед передачей в разработку сверяет прототип с дизайн-системой — сетка, шаг отступов, компоненты библиотеки — и приводит отклонения к системе, сохраняя идею экрана", "artifact": false}, {"id": "R06", "level": 3, "line": "Состояния и адаптация", "anchor": false, "text": "Адаптирует экран под телефон по данным о задачах пользователя: ключевое оставляет на экране, остальное убирает за кнопку, а не уменьшает шрифт", "artifact": false}, {"id": "R07", "level": 1, "line": "Передача и правила", "anchor": false, "text": "Передаёт прототип разработке по чек-листу и помечает, что сделано ИИ; сроки по коду не называет, а передаёт вопрос руководителю", "artifact": false}, {"id": "R08", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Собирает кликабельный прототип в коде по макету и описанию сценария так, что сценарий проходится от начала до конца", "artifact": false}, {"id": "R09", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Проверяет ИИ-макет на доступность: контраст, размер кликабельных зон, порядок фокуса, альтернативные тексты — и исправляет найденное", "artifact": false}, {"id": "R10", "level": 3, "line": "Постановка задачи ИИ", "anchor": false, "text": "Подключает дизайн-систему к ИИ-инструменту — библиотека, токены, связь с кодом, — чтобы генерация шла из готовых компонентов, а не «рисовала похожее»", "artifact": false}, {"id": "R11", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Проверяет гипотезу рабочим ИИ-прототипом на реальных пользователях и отделяет проверенное от того, что «дорисовал» ИИ", "artifact": false}, {"id": "R12", "level": 3, "line": "Состояния и адаптация", "anchor": false, "text": "Проектирует ИИ-функцию продукта: что показываем при неуверенности модели, как пользователь исправляет ошибку, где раскрываем, что отвечает ИИ", "artifact": false}, {"id": "R13", "level": 4, "line": "Передача и правила", "anchor": false, "text": "Задаёт команде правила ИИ-прототипирования: что генерируем, как сверяем с дизайн-системой, что передаём в разработку", "artifact": true}], "roles": [{"name": "Веб-дизайнер", "thr": 3, "core": true}, {"name": "Продуктовый дизайнер", "thr": 3, "core": true}]}, {"code": "V", "name": "Сборка роликов из шаблона", "tagline": "Ролики из шаблона, одна новость в трёх форматах площадок, субтитры и озвучка, проверка на телефоне перед публикацией.", "how": "ролик собирается параметрами шаблона: тексты, титры и переходы задаются данными, а не монтируются вручную по кадрам. Одна новость выходит в трёх форматах для трёх площадок за час. Субтитры ставятся автоматически, а термины и названия программ после расшифровки сверяются со списком и правятся руками. Перед публикацией ролик смотрят на телефоне.", "top": 4, "who": "Уровень для Middle: SMM-дизайнер — 2, Видео/моушен-дизайнер — 2. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Заполняет поля шаблона ролика по инструкции — тексты, имена, даты — и отдаёт сборку на проверку; элемент вне инструкции не меняет, а спрашивает автора шаблона", "2": "Собирает ролик из шаблона и выпускает его в форматах трёх площадок, ставит субтитры и озвучку, исправляет термины в расшифровке по списку", "3": "Переделывает шаблон под новый формат в копии и проверяет тестовым рендером; перед публикацией проверяет ролик на телефоне; решает, заменять ли спикера ИИ-аватаром, и получает письменное согласие", "4": "Ведёт для команды библиотеку шаблонов и регламент выпуска: кто проверяет, что помечается, где лежат исходники"}, "lines": [{"name": "Сборка по шаблону", "checks": "собран ли ролик из шаблона по заданным полям и параметрам и выпущен ли под нужные форматы"}, {"name": "Проверка результата", "checks": "проверен ли готовый ролик — титры, тайминги, расшифровка и написание терминов — до выдачи"}, {"name": "Обращение с данными", "checks": "есть ли письменное согласие человека на использование его голоса и лица"}], "atoms": [{"id": "V01", "level": 1, "line": "Сборка по шаблону", "anchor": false, "text": "Заполняет в шаблоне ролика поля из инструкции — тексты, имена, даты — и отдаёт сборку на проверку; элемент вне инструкции не меняет, а спрашивает автора шаблона", "artifact": false}, {"id": "V02", "level": 2, "line": "Сборка по шаблону", "anchor": false, "text": "Собирает ролик из шаблона: тексты, титры, переходы задаются параметрами", "artifact": false}, {"id": "V03", "level": 2, "line": "Сборка по шаблону", "anchor": false, "text": "Выпускает серию однотипных видео под площадки, меняя данные шаблона", "artifact": false}, {"id": "V04", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Ставит автоматические субтитры и озвучку и исправляет в расшифровке термины и названия программ по списку, не меняя слов спикера и таймкодов", "artifact": false}, {"id": "V05", "level": 3, "line": "Сборка по шаблону", "anchor": false, "text": "Переделывает шаблон сборки под новый формат с ИИ-ассистентом: выносит размер кадра и тайминги в параметры, работает в копии шаблона и проверяет оба формата тестовым рендером", "artifact": false}, {"id": "V06", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Перед публикацией смотрит готовый ролик на телефоне и проверяет титры (кегль, контраст с фоном, отступ от кнопок площадки), тайминги и брендбук", "artifact": false}, {"id": "V07", "level": 3, "line": "Обращение с данными", "anchor": false, "text": "Решает, заменять ли реального спикера ИИ-аватаром или синтезированным голосом, и до начала работы получает письменное согласие человека, с которого сделан аватар", "artifact": false}, {"id": "V08", "level": 4, "line": "Сборка по шаблону", "anchor": false, "text": "Ведёт для команды библиотеку шаблонов роликов и правила выпуска: кто проверяет, что помечаем, где исходники", "artifact": true}, {"id": "V09", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, что нельзя ставить в ролик без разрешения: голос и лицо человека, чужую музыку и кадры без лицензии; материал без согласия и лицензии в сборку не берёт, а спрашивает руководителя", "artifact": false}], "roles": [{"name": "SMM-дизайнер", "thr": 2, "core": false}, {"name": "Видео/моушен-дизайнер", "thr": 2, "core": false}]}, {"code": "W", "name": "Генерация видео", "tagline": "Вставки, заставки и серии шотов по описанию — с контролем героя, артефактов и расхода кредитов.", "how": "фоновая анимация, заставка или серия шотов генерируется по описанию и референсам, а не ищется на стоках. При склейке шотов лицо, костюм и свет героя не меняются, логотип и текст в кадре не плывут — это проверяют покадрово. До запуска считают кредиты: сколько дублей уходит на один годный шот. Перед публикацией сверяют условия тарифа и правила площадки о раскрытии ИИ-контента.", "top": 4, "who": "Уровень для Middle: Видео/моушен-дизайнер — 2, SMM-дизайнер — 1. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Работает по памятке о правах: проверяет тариф и пометку об ИИ до публикации; ролик без пометки не публикует, спорный случай показывает руководителю", "2": "Пишет запрос на вставку, генерирует три варианта и отбирает по признакам: нет артефактов и мерцания, есть свободная зона под титры, длительность совпадает с фрагментом; держит одного героя в серии шотов", "3": "Разбирает артефакты и выбирает: перегенерация, маска, ручная правка или отказ; до запуска считает кредиты на дубли; фиксирует общий запрос для серии вставок и проверяет его на пробной партии", "4": "Пишет для команды правила видеогенерации: разрешённые модели и тарифы, что проверяем, как помечаем"}, "lines": [{"name": "Обращение с данными", "checks": "учтены ли условия тарифа, права на коммерческое использование и пометка об ИИ"}, {"name": "Постановка задачи ИИ", "checks": "как собран запрос на генерацию — описание, образцы, референсы и настройки для серии"}, {"name": "Проверка результата", "checks": "отобран ли кадр по признакам и найдены ли артефакты генерации"}], "atoms": [{"id": "W01", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает ограничения на коммерческое использование сгенерированного видео и изображений: условия тарифа, правила площадок о раскрытии ИИ-контента, правило компании о пометке; ролик без пометки не публикует", "artifact": false}, {"id": "W02", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Формулирует запрос на концепт: стиль, композиция, образцы, ограничения", "artifact": false}, {"id": "W03", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Генерирует три варианта вставки по описанию и отбирает для монтажа по признакам: нет артефактов и мерцания, есть свободная зона под титры, длительность совпадает с фрагментом", "artifact": false}, {"id": "W04", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Генерирует серию шотов с одним персонажем или локацией от референсов и первого/последнего кадра так, что при склейке не «прыгают» лицо, костюм и свет", "artifact": false}, {"id": "W05", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Находит в сгенерированном видео артефакты — морфинг, физика, руки, текст в кадре, мерцание — и решает: перегенерация, маска, ручная правка или отказ", "artifact": false}, {"id": "W06", "level": 3, "line": "Постановка задачи ИИ", "anchor": false, "text": "Считает бюджет генерации — кредиты, итерации, время — и решает, что дешевле: генерация, сток или съёмка", "artifact": false}, {"id": "W07", "level": 3, "line": "Постановка задачи ИИ", "anchor": false, "text": "Фиксирует для серии вставок общий запрос, образец стиля и настройки, меняет только тему и формат площадки, проверяет на пробной партии из трёх", "artifact": false}, {"id": "W08", "level": 4, "line": "Обращение с данными", "anchor": false, "text": "Пишет для команды правила видеогенерации: разрешённые модели и тарифы, что проверяем, как помечаем", "artifact": true}], "roles": [{"name": "SMM-дизайнер", "thr": 1, "core": false}, {"name": "Видео/моушен-дизайнер", "thr": 2, "core": false}]}, {"code": "Y", "name": "Анимация, озвучка и дубляж", "tagline": "Раскадровки, оживление макетов, маски, озвучка и музыка с лицензией, дубляж, апскейл архива.", "how": "раскадровка ролика собирается по брифу за час; статичная обложка превращается в пятисекундный цикл; посторонний человек убирается из кадра маской за минуты. Закадровый текст озвучивается синтезом, и человек сверяет произношение названий программ со списком; на музыку сохраняется подтверждение лицензии. Голос и лицо реального человека используются только с его письменного согласия.", "top": 4, "who": "Уровень для Middle: Видео/моушен-дизайнер — 3. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Работает с голосом и лицом человека только по письменному согласию, полученному до начала работы; без согласия работу не начинает, а спрашивает руководителя", "2": "Собирает по брифу раскадровку и 2–3 варианта сценария, оживляет макет, делает маски, готовит озвучку и музыку с подтверждённой коммерческой лицензией, ставит отметку об ИИ на площадке", "3": "Решает про апскейл по тесту на фрагменте с лицами, делает дубляж и липсинк после письменного согласия спикера и сверяет термины с глоссарием", "4": "Пишет правила для видеопроизводства: что можно генерировать, чьё согласие нужно, где хранятся лицензии, как помечается ролик"}, "lines": [{"name": "Обращение с данными", "checks": "есть ли согласие на голос и лицо, подтверждённые лицензии и раскрытие ИИ на площадке"}, {"name": "Постановка задачи ИИ", "checks": "как по брифу собраны раскадровка и варианты сценария"}, {"name": "Производство материала", "checks": "как сделаны движение макета, маски и дубляж с липсинком"}, {"name": "Проверка результата", "checks": "сверены ли произношение терминов и качество апскейла на тестовом фрагменте"}], "atoms": [{"id": "Y01", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, что голос и лицо человека — в том числе «похожий» синтез — используются только с письменного согласия, и где шаблон согласия; без согласия голос и лицо не синтезирует и не публикует", "artifact": false}, {"id": "Y02", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Собирает с ИИ по брифу раскадровку и 2–3 варианта сценария: сцены, хронометраж каждой, что в кадре, закадровый текст", "artifact": false}, {"id": "Y03", "level": 2, "line": "Производство материала", "anchor": false, "text": "Оживляет статичный макет: движение от изображения с управлением камерой и ключевыми кадрами, бесшовный цикл; лица и текст берёт из исходных слоёв без генерации", "artifact": false}, {"id": "Y04", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Готовит озвучку и локализацию через синтез речи и проверяет произношение терминов", "artifact": false}, {"id": "Y05", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Повышает разрешение и частоту кадров архивного видео через тест: прогоняет фрагмент с лицами, сравнивает с оригиналом на целевом экране и отказывается от апскейла, если лица меняются", "artifact": false}, {"id": "Y06", "level": 4, "line": "Обращение с данными", "anchor": false, "text": "Пишет для видеопроизводства правила по сгенерированному материалу: что можно генерировать, чьё согласие нужно, где хранятся подтверждения лицензий, как помечается ролик", "artifact": true}, {"id": "Y07", "level": 2, "line": "Производство материала", "anchor": false, "text": "Делает маски, ротоскоп и удаление объектов ИИ-инструментом и проверяет края на движении и волосах покадрово", "artifact": false}, {"id": "Y08", "level": 2, "line": "Обращение с данными", "anchor": false, "text": "Чистит звук и собирает музыкальную подложку ИИ-инструментом, проверяя условия лицензии тарифа для коммерческого использования", "artifact": false}, {"id": "Y09", "level": 2, "line": "Обращение с данными", "anchor": false, "text": "Перед публикацией выставляет раскрытие ИИ на площадке, если в ролике реалистичные синтетические люди, события или голос", "artifact": false}, {"id": "Y10", "level": 3, "line": "Производство материала", "anchor": false, "text": "Делает дубляж и липсинк на другой язык и проверяет артикуляцию, термины и согласие спикера на синтез его голоса", "artifact": false}], "roles": [{"name": "Видео/моушен-дизайнер", "thr": 3, "core": true}]}, {"code": "I", "name": "Анализ отзывов и интервью", "tagline": "Разбор отзывов с частотой и цитатами, гайды интервью, проверка выводов по выгрузке, гипотезы для спринта.", "how": "четыреста отзывов разбираются в пять–семь повторяющихся проблем с частотой и дословными цитатами — за вечер, а не за неделю. Каждый вывод сверяется с выгрузкой: ИИ может обобщить то, чего в отзывах нет. Персональные данные убираются до загрузки. Ответы нейросети от лица студента подписываются как гипотеза.", "top": 4, "who": "Уровень для Middle: Продуктовый дизайнер — 2. Junior — на уровень ниже, Senior — выше. Исследования нужны также тем, кто работает с обратной связью.", "levels": {"1": "Готовит подборку отзывов по инструкции и обезличивает материалы до загрузки; цитаты в сводке ИИ сверяет с исходными отзывами; вывод показывает руководителю", "2": "Разбирает выгрузку отзывов на проблемы с частотой и дословными цитатами. Готовит гайд интервью с таймингом и открытыми вопросами без наводящих", "3": "Сверяет каждый вывод ИИ с выгрузкой. К каждой проблеме готовит гипотезу причины и решения с эффектом и трудозатратами. ИИ-персону использует только для гипотез", "4": "Пишет порядок ИИ-анализа исследований для команды: что обезличиваем, как храним, как помечаем выводы, проверенные по исходным данным"}, "lines": [{"name": "Обращение с данными", "checks": "обезличены ли расшифровки и отзывы до загрузки в сервис"}, {"name": "Проверка результата", "checks": "сверены ли цитаты и выводы ИИ с исходной выгрузкой"}, {"name": "Разбор отзывов и интервью", "checks": "как массив разобран на проблемы, вопросы гайда и гипотезы решений"}, {"name": "ИИ-персона вместо людей", "checks": "для каких задач допустима ИИ-персона и как помечен её результат"}], "atoms": [{"id": "I01", "level": 1, "line": "Проверка результата", "anchor": false, "text": "Готовит подборку отзывов по инструкции и отмечает в сводке цитаты, которых нет в отзывах; вывод по такой сводке не делает сам, а показывает руководителю", "artifact": false}, {"id": "I02", "level": 2, "line": "Разбор отзывов и интервью", "anchor": false, "text": "Разбирает массив отзывов и выделяет повторяющиеся проблемы с частотой и цитатами", "artifact": false}, {"id": "I03", "level": 2, "line": "Разбор отзывов и интервью", "anchor": false, "text": "Готовит гайд интервью под гипотезу — блоки с таймингом, открытые вопросы о прошлом опыте без наводящих — и черновой разбор расшифровок по этому гайду", "artifact": false}, {"id": "I04", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Сверяет каждый вывод ИИ с исходной выгрузкой: находит и считает подтверждающие отзывы, выводы без опоры в данных помечает как предположение", "artifact": false}, {"id": "I05", "level": 3, "line": "Разбор отзывов и интервью", "anchor": false, "text": "К каждой проблеме готовит гипотезу причины и 1–2 решения с ожидаемым эффектом и трудозатратами, допущения помечает", "artifact": false}, {"id": "I06", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, что расшифровки интервью и отзывы с персональными данными обезличиваются до загрузки в ИИ-сервис; необезличенный материал в сервис не загружает", "artifact": false}, {"id": "I07", "level": 1, "line": "ИИ-персона вместо людей", "anchor": false, "text": "Использует ИИ-персону только для задач из списка — гипотезы и черновик гайда — и помечает материал как черновик; за выводами о пользователях идёт к руководителю", "artifact": false}, {"id": "I08", "level": 3, "line": "ИИ-персона вместо людей", "anchor": false, "text": "Использует ИИ-персону только для гипотез и черновика гайда и подписывает результат как гипотезу. На просьбу заменить интервью нейросетью отвечает планом с интервью в срок руководителя", "artifact": false}, {"id": "I09", "level": 4, "line": "Обращение с данными", "anchor": false, "text": "Задаёт команде порядок ИИ-анализа исследований: что обезличиваем, как храним, как помечаем выводы «проверено на сырых данных»", "artifact": true}], "roles": [{"name": "Продуктовый дизайнер", "thr": 2, "core": false}]}, {"code": "F", "name": "Правка и печать изображений", "tagline": "Убирает артефакты и правит изображение по инструкции, поднимает разрешение, готовит файл в печать по требованиям типографии.", "how": "сгенерированная изображение почти никогда не готова. Дизайнер убирает лишнее и расширяет фон под формат, находит шестой палец и поплывший логотип, поднимает разрешение под ролл-ап и при 100% проверяет, что апскейл не дорисовал деталей. Файл в печать готовит по требованиям типографии: dpi, профиль CMYK, вылеты. Перед сдачей делает обратный поиск по изображению: нет ли сходства с чужим персонажем или знаком.", "top": 4, "who": "Уровень для Middle: Графический дизайнер — 3, SMM-дизайнер — 2, Веб-дизайнер — 1, Средовой (3D) дизайнер — 1. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Проверяет изображение при 100% масштабе по списку типовых артефактов и отмечает найденное; результат показывает руководителю; что генерировать заново, сам не решает", "2": "Правит изображение по инструкции так, что правка не видна при 100%; единичные артефакты исправляет, вариант с артефактами в нескольких зонах бракует; готовит файл по требованиям типографии; проверяет сходство обратным поиском", "3": "Делает знак для айдентики: генерацию берёт как эскиз, перестраивает вручную и фиксирует свой вклад по этапам, чтобы знак можно было зарегистрировать", "4": "Пишет для команды стандарт приёмки: чек-лист артефактов, требования к исходникам, кто подписывает выпуск в печать"}, "lines": [{"name": "Проверка результата", "checks": "находит артефакты при 100% и решает судьбу варианта"}, {"name": "Правка и печать", "checks": "незаметность правки и готовность файла к носителю и печати"}, {"name": "Обращение с данными", "checks": "сходство с чужим и авторский вклад в знак"}], "atoms": [{"id": "F01", "level": 1, "line": "Проверка результата", "anchor": false, "text": "Проверяет изображение при 100% по списку артефактов и отмечает найденное: анатомия, текст, геометрия, тени; что переделывать, решает не сам, а спрашивает руководителя", "artifact": false}, {"id": "F02", "level": 2, "line": "Правка и печать", "anchor": false, "text": "Правит изображение по инструкции — убирает или заменяет объект, расширяет фон, меняет деталь — так, что правка не видна при 100% масштабе", "artifact": false}, {"id": "F03", "level": 2, "line": "Проверка результата", "anchor": false, "text": "Проверяет сгенерированное при 100% на артефакты: единичные исправляет по маске, вариант с артефактами сразу в нескольких зонах бракует", "artifact": false}, {"id": "F04", "level": 2, "line": "Правка и печать", "anchor": false, "text": "Готовит результат к выпуску по требованиям носителя: апскейл до нужного dpi, векторизация, цветовой профиль — и при 100% проверяет, что апскейл не дорисовал деталей", "artifact": false}, {"id": "F05", "level": 2, "line": "Правка и печать", "anchor": false, "text": "Готовит ИИ-изображение к печати: разрешение под формат, CMYK и профиль, вылеты, проверка на 100%", "artifact": false}, {"id": "F06", "level": 2, "line": "Обращение с данными", "anchor": false, "text": "До передачи заказчику проверяет обратным поиском по изображению, нет ли сходства с известными персонажами, знаками и стоковыми изображениями; найденное перерабатывает", "artifact": false}, {"id": "F07", "level": 3, "line": "Обращение с данными", "anchor": false, "text": "Разрабатывает айдентику с ИИ так, чтобы знак можно было зарегистрировать: генерацию берёт как эскиз, перестраивает знак вручную, фиксирует этапы и свой вклад", "artifact": false}, {"id": "F08", "level": 4, "line": "Проверка результата", "anchor": false, "text": "Пишет для команды стандарт приёмки ИИ-визуала: чек-лист артефактов, требования к исходникам, кто подписывает выпуск в печать", "artifact": true}, {"id": "F09", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, какие исходники нельзя загружать в сервисы правки и апскейла: неанонсированные материалы, чужие работы, фото людей без согласия; материал вне списка не загружает, а спрашивает руководителя", "artifact": false}], "roles": [{"name": "SMM-дизайнер", "thr": 2, "core": false}, {"name": "Веб-дизайнер", "thr": 1, "core": false}, {"name": "Графический дизайнер", "thr": 3, "core": true}, {"name": "Средовой (3D) дизайнер", "thr": 1, "core": false}]}, {"code": "D", "name": "Визуализация пространств", "tagline": "Концепты пространств по фото площадки, рендер поверх своей модели, 3D-ассеты и текстуры, сверка с моделью и регламентом площадки до показа.", "how": "дизайнер собирает белую модель стенда по габаритам площадки и за час получает десяток вариантов атмосферы поверх своей геометрии, а не один рендер за ночь. Мебель и декор второго плана генерируются по фото, приводятся к масштабу и проверяются на лицензию тарифа. Перед показом заказчику изображение сверяют с моделью и регламентом площадки: ИИ часто рисует консоль без опоры и подвес, который никто не согласует.", "top": 4, "who": "Уровень для Middle: Средовой (3D) дизайнер — 2. Junior — на уровень ниже, Senior — выше.", "levels": {"1": "Проверяет ИИ-рендер по чек-листу площадки: опоры, масштаб, материалы; планы и сканы площадок наружу не загружает; расхождение с планом показывает руководителю", "2": "Делает концепт по фото и габаритам площадки с сохранёнными пропорциями, делает ИИ-рендер поверх своей модели без смены геометрии и ракурса, генерирует ассеты и текстуры и приводит их к масштабу, полигонажу и лицензии", "3": "Сверяет каждую ИИ-визуализацию с моделью и регламентом площадки до показа заказчику, собирает повторяемый конвейер от сцены до облёта и проверяет тестовые кадры", "4": "Пишет правила для команды и подрядчиков: разрешённые сервисы и тарифы, проверки перед показом, пометка «концепт, не для производства»"}, "lines": [{"name": "Обращение с данными", "checks": "что из материалов заказчика можно загружать во внешние сервисы"}, {"name": "Постановка задачи ИИ", "checks": "как собран запрос на концепт пространства — назначение, габариты, сценарий, материалы"}, {"name": "Проверка результата", "checks": "сверена ли визуализация с моделью, планом и требованиями площадки до показа"}, {"name": "Сцена и ассеты", "checks": "приведены ли рендер, ассеты и текстуры к сцене — геометрия, масштаб, повторяемость конвейера"}], "atoms": [{"id": "D01", "level": 1, "line": "Обращение с данными", "anchor": true, "text": "Знает, какие материалы нельзя загружать во внешние 3D- и рендер-сервисы: планы и сканы площадок заказчика, неанонсированные стенды, модели с ограничивающей лицензией; материал вне списка не загружает, а спрашивает руководителя", "artifact": false}, {"id": "D02", "level": 1, "line": "Проверка результата", "anchor": false, "text": "Проверяет ИИ-рендер по чек-листу площадки: опоры, масштаб по плану, материалы из списка; расхождение с планом не правит, а показывает руководителю", "artifact": false}, {"id": "D03", "level": 2, "line": "Постановка задачи ИИ", "anchor": false, "text": "Формулирует запрос на концепт пространства по описанию и фото площадки — назначение, габариты, сценарий посетителя, материалы — так, что варианты сохраняют пропорции помещения", "artifact": false}, {"id": "D04", "level": 2, "line": "Сцена и ассеты", "anchor": false, "text": "Делает ИИ-рендер поверх белой модели или вида из редактора так, что геометрия, пропорции и ракурс совпадают с исходником", "artifact": false}, {"id": "D05", "level": 2, "line": "Сцена и ассеты", "anchor": false, "text": "Генерирует 3D-ассет по изображению или описанию и доводит его до сцены: масштаб, полигонаж, материалы, права на использование", "artifact": false}, {"id": "D06", "level": 2, "line": "Сцена и ассеты", "anchor": false, "text": "Генерирует бесшовную текстуру или набор карт материала и проверяет стыки, масштаб фактуры и карты на тестовом объекте", "artifact": false}, {"id": "D07", "level": 3, "line": "Проверка результата", "anchor": false, "text": "Сверяет ИИ-визуализацию с моделью и требованиями площадки до показа заказчику: находит нестроящиеся элементы и решает, что исправить, а что подписать «концепт, не для производства»", "artifact": false}, {"id": "D08", "level": 3, "line": "Сцена и ассеты", "anchor": false, "text": "Собирает повторяемый конвейер визуализации — сцена, ракурсы, ИИ-рендер, апскейл, облёт — или поручает рутину ИИ-ассистенту в 3D-редакторе: сохраняет копию сцены до запуска, проверяет тестовые кадры и находит сбои (сбитые материалы, масштаб текстур)", "artifact": false}, {"id": "D09", "level": 4, "line": "Обращение с данными", "anchor": false, "text": "Задаёт команде правила работы с 3D-ИИ: разрешённые инструменты и тарифы, что проверяется перед показом, как помечаются концепты", "artifact": true}], "roles": [{"name": "Средовой (3D) дизайнер", "thr": 2, "core": true}]}], "roles": [{"name": "SMM-дизайнер", "short": "SMM", "core": "K", "comps": [{"code": "B", "thr": 2}, {"code": "G", "thr": 2}, {"code": "K", "thr": 3}, {"code": "V", "thr": 2}, {"code": "W", "thr": 1}, {"code": "F", "thr": 2}]}, {"name": "Веб-дизайнер", "short": "Веб", "core": "R", "comps": [{"code": "B", "thr": 2}, {"code": "G", "thr": 2}, {"code": "K", "thr": 1}, {"code": "R", "thr": 3}, {"code": "F", "thr": 1}]}, {"name": "Видео/моушен-дизайнер", "short": "Видео", "core": "Y", "comps": [{"code": "B", "thr": 2}, {"code": "V", "thr": 2}, {"code": "W", "thr": 2}, {"code": "Y", "thr": 3}]}, {"name": "Графический дизайнер", "short": "График", "core": "F", "comps": [{"code": "B", "thr": 2}, {"code": "G", "thr": 2}, {"code": "K", "thr": 2}, {"code": "F", "thr": 3}]}, {"name": "Продуктовый дизайнер", "short": "Продукт", "core": "R", "comps": [{"code": "B", "thr": 2}, {"code": "R", "thr": 3}, {"code": "I", "thr": 2}]}, {"name": "Средовой (3D) дизайнер", "short": "Среда", "core": "D", "comps": [{"code": "B", "thr": 2}, {"code": "G", "thr": 2}, {"code": "K", "thr": 2}, {"code": "F", "thr": 1}, {"code": "D", "thr": 2}]}]};

function ic(name, size = 16) {
  let svg = RAWICONS[name];
  if (svg) {
    svg = svg.replace(/fill="none"/g, '').replace(/<path /g, '<path fill="currentColor" ')
      .replace(/width="[\d.]+" height="[\d.]+"/, '');
    svg = svg.replace('<svg ', `<svg width="${size}" height="${size}" `);
  } else {
    svg = `<svg width="${size}" height="${size}" viewBox="0 0 16 16"><path fill="currentColor" d="${EXTRA[name] || EXTRA.chevron}"/></svg>`;
  }
  return `<span class="i">${svg}</span>`;
}

/* ---------- экран: шаг диагностики ---------- */
const stepTag = (n, name) => `<div class="steptag"><span class="chipnum">Шаг ${n} из ${DATA.steps.length}</span><b>${name}</b></div>`;
const KIND_NAME = { m: 'Правило работы', i: 'Выбор изображения', c: 'Разбор ситуации', star: 'Ваш случай' };

function stepAsk(st, n) {
  if (st.kind === 'star') {
    const frame = st.frame.map(([a, b]) => `<div class="frow"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');
    const rec = S.rec === 'go' ? `<div class="rec"><span class="dot"></span><span class="wave">${'<i></i>'.repeat(16)}</span><b class="rt">0:38</b><span>идёт запись</span><div class="btn sm act" data-rec="stop">Остановить</div></div>`
      : S.rec === 'done' ? `<div class="rec"><span class="dot" style="background:var(--icons)"></span><span class="wave still">${'<i></i>'.repeat(16)}</span><b>2:38</b><span>расшифровка ниже</span></div>
         <div class="ta filled" style="margin-top:8px">${esc(st.sample.slice(0, 420))}…</div>`
        : `<div class="row"><div class="btn sec act" data-rec="go">${ic('mic', 16)}Рассказать голосом</div>
           <div class="btn sec act" data-none="1">Такого случая не было</div></div>`;
    return bot(stepTag(n, 'Ваш случай') +
      `<p>Вспомните случай из своей работы, где вы ${esc(st.about)}. Нужен настоящий случай с деталями: сроки, числа, названия того, что вы сдавали.</p>
       <div class="card"><div class="lbl">Расскажите по четырём пунктам</div>${frame}</div>
       <div class="card">${rec}
       ${S.rec === 'done' ? '<div class="row"><div class="btn act" data-send="1">Отправить</div></div>' : ''}</div>`);
  }
  let body = '';
  if (st.kind === 'i') {
    body = `<div class="shots">${st.shots.map((sh, i) => `<div class="shotcard${S.sel.includes(i) ? ' sel' : ''}" data-opt="${i}">
      ${shotSVG(sh.look)}<div class="shotcap"><span class="bx">${S.sel.includes(i) ? '✓' : ''}</span>
      <b>Вариант ${sh.id}</b>${esc(sh.alt)}</div></div>`).join('')}</div>
      <div class="hint">Отметьте подходящие кадры — можно несколько.</div>`;
  } else {
    body = `<div class="opts">${st.opts.map((o, i) => `<div class="opt${S.sel.includes(i) ? ' sel' : ''}" data-opt="${i}">
      <span class="bx">${S.sel.includes(i) ? '✓' : ''}</span>${esc(o.t)}</div>`).join('')}</div>
      <div class="hint">${st.kind === 'm' ? 'Можно выбрать несколько. Засчитывается полностью верный набор.' : 'Выберите одно действие.'}</div>`;
  }
  const why = st.why_q ? `<div class="card"><div class="lbl">${esc(st.why_q)}</div>
    <div class="ta${S.why ? ' filled' : ''}" data-why="1">${S.why ? esc(S.why) : 'Нажмите, чтобы подставить пример обоснования'}</div></div>` : '';
  return bot(stepTag(n, KIND_NAME[st.kind]) + `<p>${esc(st.q)}</p><div class="card">${body}</div>${why}
    <div class="row"><div class="btn act${S.sel.length ? '' : ' off'}" data-send="1">Ответить</div></div>`);
}

function stepResult(st, n) {
  if (st.kind === 'star') {
    const got = S.rec === 'none' ? 1 : st.level;
    const ok = st.marks['1'].concat(st.marks['2']).slice(0, 4);
    const miss = st.marks['3'].slice(0, 3);
    return umsg(S.rec === 'none' ? 'Такого случая не было' : `${ic('mic', 14)}голосовое сообщение 2:38`) +
      bot(`<div class="verd"><span class="lvl">Уровень ${got} из 3</span>
        <span class="sub2"><em>должности нужен уровень 3</em><em>${S.rec === 'none' ? 'поставлен по сценарию' : 'поставлен по вашему случаю'}</em></span></div>
        <div class="card"><div class="lbl">Что подтвердилось</div><ul class="okli">${ok.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="card"><div class="lbl">Чего не хватило для уровня 3</div><ul class="noli">${miss.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <p class="hint">Оценивается содержание рассказа: устная речь, паузы и огрехи расшифровки на уровень не влияют.</p>
        <div class="row"><div class="btn act" data-next="1">Смотреть итог</div></div>`);
  }
  /* состояния ответа: что человек отметил верно, что зря, что пропустил — видно по каждой строке */
  const items = st.kind === 'i' ? st.shots.map((x, i) => ({ key: x.pick, mine: S.sel.includes(i), label: x.id, note: x.note, look: x.look, alt: x.alt }))
    : st.opts.map((o, i) => ({ key: o.ok, mine: S.sel.includes(i), label: i + 1, note: o.fb || '', alt: o.t }));
  const hit = items.filter(x => x.key && x.mine), extra = items.filter(x => !x.key && x.mine), miss = items.filter(x => x.key && !x.mine);
  const right = !extra.length && !miss.length;
  const cls = x => x.key && x.mine ? 'hit' : (!x.key && x.mine ? 'extra' : (x.key ? 'miss' : 'plain'));
  const mark = x => x.key && x.mine ? '✓' : (!x.key && x.mine ? '✕' : (x.key ? '!' : ''));
  const sel = st.kind === 'i'
    ? `<div class="shots">${items.map(x => `<div class="shotcard ans-${cls(x)}">${shotSVG(x.look)}
        <div class="shotcap"><span class="bx">${mark(x)}</span><b>Вариант ${x.label}</b>${esc(x.note)}</div></div>`).join('')}</div>`
    : `<div class="opts">${items.map(x => `<div class="opt ans-${cls(x)}"><span class="bx">${mark(x)}</span>
        <span>${esc(x.alt)}${x.note && (x.mine || x.key) ? `<em class="optfb">${esc(x.note)}</em>` : ''}</span></div>`).join('')}</div>`;
  const summary = [
    hit.length ? `<li class="s-hit">${hit.length} ${hit.length === 1 ? 'отмечен верно' : 'отмечено верно'}: ${hit.map(x => x.label).join(', ')}</li>` : '',
    extra.length ? `<li class="s-extra">лишнее: ${extra.map(x => x.label).join(', ')}</li>` : '',
    miss.length ? `<li class="s-miss">пропущено: ${miss.map(x => x.label).join(', ')}</li>` : ''
  ].filter(Boolean).join('');
  return umsg(st.kind === 'i' ? `Отмечены: ${S.sel.map(i => st.shots[i].id).join(', ') || '—'}`
    : `Вариант ${S.sel.map(i => i + 1).join(', ') || '—'}`) +
    bot(`<div class="verd"><span class="lvl${right ? '' : ' no'}">${right ? 'Засчитано' : 'Не засчитано'}</span>
      <span class="vsub">${esc(st.compName)}</span></div>
      <div class="card"><div class="lbl">Ваш ответ</div><ul class="anssum">${summary}</ul>
        <div class="legans"><span><i class="bx hit">✓</i>верно</span><span><i class="bx extra">✕</i>лишнее</span>

      <div class="card">${sel}</div>
      <div class="card"><p style="font-size:13.5px;line-height:19px;margin:0">${esc(right ? (st.ok_fb || 'Верно.') : st.fb)}</p>
      ${right ? '' : '<p class="hint" style="margin-top:8px">Навык уходит в трек: после диагностики вы получите короткий урок по нему.</p>'}</div>
      <div class="row"><div class="btn act" data-next="1">${n < DATA.steps.length ? 'Дальше' : 'Смотреть итог'}</div></div>`);

function diag() {
  const n = S.si + 1, st = DATA.steps[S.si];
  const hist = DATA.steps.slice(0, S.si).map((p, i) => bot(`<div class="steptag"><span class="chipnum">Шаг ${i + 1}</span><b>${KIND_NAME[p.kind]}</b></div>

  const body = S.phase === 'ask' ? stepAsk(st, n) : stepResult(st, n);

/* ---------- экран: итог диагностики ---------- */
function compLevel(code) {
  if (code !== 'G') return 2;

function result() {
  const rows = DATA.comps.map(c => {

/* ---------- экран: профиль со скилл-древом ---------- */
function tree() {
  /* Ветка компетенций как в скилл-древе первого прототипа: узлы идут по часовой стрелке,
     у каждого иконка, дуга прогресса, замок до выполнения требования и подпись с прогрессом. */
  const W = 1120, H = 400, cx = 545, cy = 275, nodes = [];
  const list = DATA.tree.map(c => {
    const all = c.atoms.length;
    const done = c.atoms.filter(a => S.closed[a.id] || (!DATA.track.some(t => t.id === a.id) && a.id !== 'G06' && a.id !== 'K08')).length;
    return { ...c, all, done, ok: done === all };
  });
  const cur = list.findIndex(c => !c.ok);
  list.forEach((c, i) => {
    // по часовой стрелке: слева → вверх → вправо, радиус чуть растёт
    const ang = (168 + i * 56) * Math.PI / 180;
    const r = 205 + i * 10;
    nodes.push({ ...c, x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r * .62, i });
  });
  // дугу рисуем через контрольные точки — ветка должна читаться как закручивание, а не лесенка
  const path = nodes.map((p, i) => {
    if (!i) return `M${p.x.toFixed(0)} ${p.y.toFixed(0)}`;
    const q = nodes[i - 1], mx = (q.x + p.x) / 2, my = (q.y + p.y) / 2;
    const k = .35, ox = (my - cy * .6) * k, oy = -(mx - cx) * k * .5;
    return `Q${(mx + ox).toFixed(0)} ${(my + oy).toFixed(0)} ${p.x.toFixed(0)} ${p.y.toFixed(0)}`;
  }).join(' ');
  const first = nodes[0], rx = first.x - 165, ry = first.y + 55;
  const svg = `<svg class="branch" viewBox="0 0 ${W} ${H}">
    <path d="M${rx.toFixed(0)} ${ry.toFixed(0)} Q${(rx + 80).toFixed(0)} ${(ry + 30).toFixed(0)} ${first.x.toFixed(0)} ${first.y.toFixed(0)}" class="bstem"/>
    <path d="${path}" class="bline"/></svg>`;
  const dots = nodes.map(p => {
    const pct = Math.round(p.done / p.all * 100);
    const state = p.ok ? 'ok' : (p.i === cur ? 'cur' : 'wait');
    const side = p.x > cx + 40 ? 'right' : 'left';   // подпись уводим в сторону от следующего узла
    return `<div class="bnode ${state} ${side} act" data-comp="${p.code}" style="left:${(p.x / W * 100).toFixed(2)}%;top:${(p.y / H * 100).toFixed(2)}%">
      ${p.i === cur ? '<span class="bnow">сейчас</span>' : ''}
      <span class="bring" style="--p:${pct}"><span class="bico">${ic(COMP_ICON[p.code] || 'ai', 20)}</span></span>
      <span class="bnum">${p.i + 1}</span>
      ${p.ok ? `<span class="block done">${ic('check', 11)}</span>` : `<span class="block">${ic('lock', 11)}</span>`}
      <span class="blabel"><b>${esc(p.name)}</b>
        <em><i>${p.done} из ${p.all}</i><i>нужно ${p.thr}</i></em></span></div>`;
  }).join('');
  return `<div class="branchwrap">${svg}
    <div class="broot" style="left:${(rx / W * 100).toFixed(2)}%;top:${(ry / H * 100).toFixed(2)}%">
      <span class="bring root"><span class="bico">${ic('ai', 22)}</span></span><b>ИИ</b></div>
    ${dots}</div>`;
}

  return `<div class="wide">

      <div class="chips"><div class="chip">${esc(DATA.role)}</div><div class="chip">диагностика сегодня</div></div></div>
