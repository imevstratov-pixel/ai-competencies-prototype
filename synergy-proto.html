<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Оценка и уроки в Synergy AI Chat — кликабельный прототип</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>/* Рамка Synergy AI Chat: токены и компоненты из Фигмы (файл xmouu5yWRMYQVveOsZ37LA, секции kit / Learning / Chat).
   Цвета, шрифт и размеры — переменные Фигмы, геометрия — из метаданных фреймов:
   сайдбар 300, шапка 64, колонка чата 800, контент курсов 1200, высота кнопки 44. */
:root{
  --accent:#ED131C; --bg:#F1F2F6; --wh:#fff; --titles:#161A1C; --usual:#757575; --border:#E6E9EE;
  --hover:#EEF0F2; --icons:#A7A8AE; --input:#E3E3E3; --input-text:#9B9B9B;
  --blue:#4561C8; --purple:#8052FF; --green:#1C8D00; --orange:#FE5B19; --pink:#D865FF;
  --shadow:0 7px 16px #C7C7C708, 0 29px 29px #C7C7C708, 0 66px 39px #C7C7C705;
  --r:16px; --r-sm:10px; --r-pill:999px;
}
*{box-sizing:border-box}
body{margin:0;background:#E9EBF0;font-family:Raleway,-apple-system,Segoe UI,sans-serif;color:var(--titles)}

/* ---------- страница с экранами ---------- */
.page{max-width:1320px;margin:0 auto;padding:40px 24px 120px}
.page h1{font-size:30px;line-height:36px;margin:0 0 6px}
.page .lead{color:var(--usual);font-size:16px;line-height:24px;margin:0 0 28px;max-width:900px}
.toc{background:var(--wh);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:36px}
.toc b{display:block;margin-bottom:8px;font-size:14px}
.toc a{display:inline-block;margin:0 14px 6px 0;color:var(--blue);text-decoration:none;font-size:14px}
.toc a:hover{text-decoration:underline}
.shot{margin:0 0 56px}
.shot header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.shot .num{background:var(--titles);color:#fff;border-radius:var(--r-pill);font-size:12px;font-weight:700;padding:3px 10px}
.shot h2{font-size:20px;line-height:24px;margin:0}
.shot .kind{font-size:12px;font-weight:700;color:var(--usual);text-transform:uppercase;letter-spacing:.04em}
.shot .note{color:var(--usual);font-size:14px;line-height:20px;margin:6px 0 14px;max-width:980px}
.shot .note b{color:var(--titles)}
.shot .new{background:#FFF4E8;border-left:3px solid var(--orange);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0 14px;font-size:14px;line-height:20px;max-width:980px}
.shot .new b{color:var(--orange)}
.pair{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}

/* рамка экрана: рисуем в натуральную величину и ужимаем под ширину страницы */
.frame{background:var(--bg);border:1px solid #D9DCE3;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transform-origin:top left}
.frame.web{width:1920px;height:1080px}
.frame.mob{width:390px;height:800px;border-radius:26px}
.scaler{overflow:hidden}

/* подзаголовок из нескольких частей: разделяет интерфейс, а не символ в строке */
.sub2{display:inline-flex;align-items:center;gap:0;color:var(--usual);font-size:12px;flex-wrap:wrap}
.sub2 em{font-style:normal;padding:0 10px;border-left:1px solid var(--border);line-height:1.1}
.sub2 em:first-child{padding-left:0;border-left:0}
.vsub{color:var(--usual);font-size:13px}
.vmsg{font-weight:600}
.msg.me .bub .i{color:var(--icons);margin-right:6px;vertical-align:-2px}
.msg.me .bub .sub2{display:block;margin-top:4px}
.msg.me .bub .sub2 em:first-child{padding-left:0}
/* заголовок шага: номер чипом, название рядом */
.steptag{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chipnum{background:var(--bg);color:var(--usual);border-radius:var(--r-pill);padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.steptag b{font-size:15px}

/* иконки из кита Фигмы: заливка — currentColor, размер задаётся в разметке */
.i{display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:0}
.i svg{display:block}
.tile{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}

/* ---------- рамка интерфейса: веб (снято с прода) ---------- */
.ui{display:flex;height:100%;font-size:14px;line-height:18px;background:var(--wh)}
.side{width:280px;flex:none;background:var(--wh);border-right:1px solid var(--border);padding:16px 14px 12px;display:flex;flex-direction:column;gap:9px}
.sidetop{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;line-height:14px;letter-spacing:.02em}
.logo i{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.lang{display:flex;gap:4px;font-size:10px;font-weight:700;color:var(--icons)}
.lang b{color:var(--titles);background:var(--bg);border-radius:4px;padding:2px 5px}
.lang span{padding:2px 5px}
.user{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 2px 10px;border-bottom:1px solid var(--border)}
.user .letter{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--usual);font-weight:700;flex:none}
.sgroup2{display:flex;align-items:center;gap:10px;padding:8px 4px;font-weight:700;font-size:13.5px;line-height:16px;color:var(--titles);white-space:nowrap}
.sgroup2 span{flex:1}
.sgroup2 .i:last-child{color:var(--icons)}
.btn-add{height:38px;border-radius:var(--r-pill);border:1.4px solid var(--accent);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--wh);font-size:13.5px}
.chatlist{display:flex;flex-direction:column}
.chatrow{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 8px;color:var(--usual);font-weight:600;font-size:13.5px}
.chatrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow i{color:var(--icons);display:inline-flex}
.menu{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:12px}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--titles);border-radius:var(--r-sm);white-space:nowrap}
.mrow.on{background:#FFEFEF;color:var(--accent)}
.mrow.on .i{color:var(--accent)}
.dotmark{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.theme{display:flex;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:.02em}
.theme span{flex:1;min-width:0;height:34px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--usual);white-space:nowrap}
.theme .i{flex:none}
.theme .on{background:#FFEFEF;color:var(--accent)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);border-radius:18px;margin:8px 8px 8px 0;overflow:hidden}
.topbar{height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--wh)}
.tbtn{height:40px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--wh);display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:13.5px;color:var(--titles);white-space:nowrap}
.tbtn .i{color:var(--icons)}
.tbtn.sq{width:40px;padding:0;justify-content:center}
.tright{margin-left:auto;display:flex;gap:10px}
.body{flex:1;overflow:hidden;position:relative;background:var(--wh)}

/* лента модуля */
.modul{height:100%;display:flex;flex-direction:column;padding:14px 0 0}
.back2{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:600;font-size:14px;padding:0 0 10px 26px}
.back2 .i{color:var(--accent)}
.feed{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:22px;padding:6px 0 10px}
.feed > *{width:min(640px,100%);max-width:640px}
.tblock h3{color:var(--accent);text-align:center;font-size:19px;line-height:24px;margin:0 0 14px}
.tblock p{font-size:14.5px;line-height:21px;margin:0 0 12px}
.aimsg{position:relative;padding-left:0}
.aibody{background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
.aispark{position:absolute;left:-28px;bottom:6px;color:var(--accent)}
.umsg{align-self:flex-end;background:var(--bg);border-radius:14px 14px 4px 14px;padding:11px 16px;font-size:14.5px;max-width:460px;width:auto}
.feed .umsg{width:auto}
.composer{width:min(660px,94%);flex:none;margin:10px auto 18px;background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:7px 8px 7px 12px;box-shadow:var(--shadow)}
.crow{display:flex;align-items:center;gap:8px}
.composer .ph{flex:1;color:var(--input-text);font-size:14.5px;padding:10px 2px}
.ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--icons);flex:none}
.sendbtn{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.sendbtn .i{color:#fff}
.btnrow{display:flex;justify-content:center;gap:12px;margin-top:4px}
.btn.out{background:var(--wh);border:1.4px solid var(--accent);color:var(--accent);font-weight:600}

/* ---------- курсы ---------- */
.content{padding:40px 0;display:flex;justify-content:center;height:100%;overflow:hidden}
.col{width:1200px}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{width:34px;height:34px;border-radius:50%;background:var(--wh);border:1px solid var(--border);display:grid;place-items:center;color:var(--usual)}
.chips{display:flex;gap:10px;margin-left:auto}
.chip{height:34px;border-radius:var(--r-pill);background:var(--wh);border:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 14px;font-size:13px;font-weight:600}
.chip.red{background:#FFECEC;border-color:#FAD4D6;color:var(--accent)}
.h2{font-size:26px;line-height:30px;margin:0 0 10px;display:flex;align-items:center;gap:12px}
.h2 i{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px;font-style:normal}
.sub{color:var(--usual);font-size:15px;line-height:22px;max-width:760px;margin:0 0 22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.mcard{background:var(--wh);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.mcard h3{font-size:16px;line-height:20px;margin:0}
.mcard p{color:var(--usual);font-size:13px;line-height:18px;margin:0;flex:1}
.mcard .foot{display:flex;align-items:center;gap:12px}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);font-weight:600}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid #F3C9CB;flex:none}
.ring.half{border-color:var(--accent);border-right-color:#F3C9CB;border-bottom-color:#F3C9CB}
.ring.full{border-color:var(--accent)}
.mcard .btn{margin-left:auto}
.mcard.assess{border-color:#F8D4D5;background:linear-gradient(180deg,#FFF7F7,#fff 60%)}
.tagline{display:inline-flex;align-items:center;gap:6px;background:#FFECEC;color:var(--accent);border-radius:var(--r-pill);padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* шаги урока */
.usteps{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.ustep{height:34px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--wh);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;color:var(--usual)}
.ustep.on{background:var(--titles);border-color:var(--titles);color:#fff}
.ustep.done{color:var(--green);border-color:#CBE8C3;background:#F1FAEF}
.ubody{background:var(--wh);border:1px solid var(--border);border-radius:var(--r);padding:26px 30px}
.ubody h3{margin:0 0 12px;font-size:20px;line-height:24px}
.ubody p{font-size:15px;line-height:23px;margin:0 0 14px}
.algo{display:flex;flex-direction:column;gap:10px;counter-reset:a}
.algo div{position:relative;padding-left:34px;font-size:15px;line-height:22px}
.algo div:before{counter-increment:a;content:counter(a);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--titles);font-size:12px;font-weight:700;display:grid;place-items:center}

/* ---------- мобильный экран (по проду) ---------- */
.mui{height:100%;display:flex;flex-direction:column;background:var(--wh);font-size:14px}
.mstatus{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:700;flex:none}
.mstatus .bars{width:58px;height:10px;background:linear-gradient(90deg,var(--titles) 0 13px,transparent 13px 17px,var(--titles) 17px 32px,transparent 32px 36px,var(--titles) 36px 58px);border-radius:2px;display:inline-block}
.mtop{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;flex:none}
.mdrop{height:38px;border-radius:var(--r-pill);border:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:600;color:var(--titles);background:var(--wh);white-space:nowrap}
.mdrop .i{color:var(--icons)}
.mburger{margin-left:auto;width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.mburger .i{color:#fff}
.mshell{flex:1;margin:0 8px 8px;background:var(--bg);border-radius:18px;padding:10px 8px 8px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.mback{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:600;font-size:14px;padding:2px 2px 10px}
.mback .i{color:var(--accent)}
.mhead2{padding:0 2px 10px}
.mhead2 b{display:block;font-size:16px;line-height:20px}
.mbody{flex:1;overflow:hidden;display:flex;flex-direction:column}
/* мобильный: лента и её содержимое тянутся по ширине экрана, а не по колонке 640 */
.mui .modul{padding:0}
.mui .feed{padding:0;gap:14px;align-items:stretch}
.mui .feed > *{width:100%;max-width:100%}
.mui .aibody{padding:12px 13px;border-radius:12px;box-shadow:none}
.mui .aispark{left:auto;right:8px;bottom:-22px}
.mui .umsg{max-width:85%}
.mui .composer{width:auto;margin:8px 0 0;border-radius:12px;padding:4px 4px 4px 8px}
.mui .crow{gap:2px}
.mui .composer .ph{font-size:14px;padding:9px 2px}
.mui .ci{width:30px;height:30px}
.mui .sendbtn{width:34px;height:34px;border-radius:9px}
.mui .shots{grid-template-columns:1fr 1fr;gap:7px}
.mui .shotcard svg{height:64px}
.mui .shotcap{padding:6px 8px 8px;font-size:11px;line-height:14px}
.mui .card{padding:10px 11px;margin-top:10px}
.mui .opt{padding:8px 10px;font-size:12.5px;line-height:16px}
.mui .btn{height:36px;padding:0 15px;font-size:12.5px}
.mui .steptag b{font-size:14px}
.mui .aibody > p{font-size:13.5px;line-height:19px}
.mui .algo div{font-size:12.5px;line-height:17px;padding-left:28px}

/* ---------- содержимое шага: вопрос, варианты, картинки, запись ---------- */
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--usual);margin:0 0 8px}
.card{background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:12px}
.aibody > p{font-size:14.5px;line-height:21px;margin:0 0 10px}
.aibody > p:last-child{margin-bottom:0}
.steptag{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chipnum{background:var(--bg);color:var(--usual);border-radius:var(--r-pill);padding:3px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.steptag b{font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.4px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13.5px;line-height:18px;background:var(--wh);display:flex;gap:10px;align-items:flex-start}
.opt .bx{width:17px;height:17px;border-radius:5px;border:1.4px solid var(--icons);flex:none;margin-top:1px;background:var(--wh)}
.opt.right{border-color:var(--green);background:#F3FAF1}
.opt.right .bx{background:var(--green);border-color:var(--green);color:#fff;display:grid;place-items:center;font-size:10px}
.opt.wrong{border-color:var(--accent);background:#FFF4F4}
.hint{color:var(--usual);font-size:12px;margin-top:8px}
.ta{border:1.4px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--input-text);font-size:13.5px;min-height:48px;background:var(--wh)}
.ta.filled{color:var(--titles);line-height:19px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{height:40px;border-radius:var(--r-pill);background:var(--accent);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px;padding:0 20px;font-size:13.5px}
.btn.sec{background:var(--wh);color:var(--titles);border:1px solid var(--border);font-weight:600}
.btn.gr{background:var(--green)}
.btn.or{background:var(--orange)}
.btn.sm{height:34px;padding:0 15px;font-size:13px}
/* выбор изображения */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shotcard{border:1.4px solid var(--border);border-radius:10px;overflow:hidden;background:var(--wh)}
.shotcard svg{display:block;width:100%;height:96px}
.shotcap{padding:8px 11px 10px;font-size:12.5px;line-height:16px;color:var(--usual);border-top:1px solid var(--border)}
.shotcap b{display:block;color:var(--titles);margin-bottom:2px}
.shotcap .bx{display:inline-block;width:15px;height:15px;border-radius:4px;border:1.4px solid var(--icons);vertical-align:-3px;margin-right:6px}
/* голос и запись экрана */
.rec{background:var(--wh);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--usual)}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.rec .wave{display:flex;align-items:center;gap:3px;height:20px;flex:1}
.rec .wave i{width:3px;background:var(--icons);border-radius:2px}
.rec .film{display:flex;gap:4px;flex:1}
.rec .film i{width:14px;height:11px;border-radius:2px;background:var(--icons);opacity:.6}
.rec b{color:var(--titles);font-variant-numeric:tabular-nums}
/* разбор */
.verd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lvl{background:var(--green);color:#fff;border-radius:var(--r-pill);padding:5px 13px;font-weight:700;font-size:12.5px}
.lvl.no{background:var(--usual)}
.lvl.part{background:var(--orange)}
.okli,.noli{margin:0;padding:0 0 0 20px;font-size:13.5px;line-height:19px}
.okli li{list-style:none;position:relative}
.okli li:before{content:"✓";color:var(--green);position:absolute;left:-18px}
.noli li{list-style:none;position:relative;color:var(--usual)}
.noli li:before{content:"—";position:absolute;left:-18px}
.vsub{color:var(--usual);font-size:12.5px}
.vmsg{font-weight:600}
.prgline{display:block;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;line-height:19px}
.prgline:last-child{border-bottom:0}
.prgline span{display:block;color:var(--usual);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.prgline b{display:block;font-weight:600}
.algo{display:flex;flex-direction:column;gap:9px;counter-reset:a}
.algo div{position:relative;padding-left:32px;font-size:13.5px;line-height:19px}
.algo div:before{counter-increment:a;content:counter(a);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--wh);color:var(--titles);font-size:11px;font-weight:700;display:grid;place-items:center}
/* подтверждение пропуска */
.modal-bg{position:absolute;inset:0;background:rgba(22,26,28,.45);display:grid;place-items:center;z-index:5}
.modal{background:var(--wh);border-radius:18px;padding:26px 28px 22px;width:430px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.modal h3{margin:0 0 10px;font-size:19px;line-height:23px}

.modul{position:relative}

/* ---------- широкие экраны: матрица и профиль ---------- */
.wide{width:100%;max-width:1180px;padding:0 0 20px}
.feed > .wide{width:100%;max-width:1180px}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{width:32px;height:32px;border-radius:50%;background:var(--wh);border:1px solid var(--border);display:grid;place-items:center;color:var(--usual)}
.chips{display:flex;gap:8px;margin-left:auto}
.chip{height:32px;border-radius:var(--r-pill);background:var(--wh);border:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 13px;font-size:12.5px;font-weight:600}
.h2{font-size:24px;line-height:28px;margin:0 0 8px;display:flex;align-items:center;gap:12px}
.sub{color:var(--usual);font-size:14px;line-height:20px;max-width:760px;margin:0 0 20px}
.mx{background:var(--wh);border:1px solid var(--border);border-radius:14px;overflow:hidden}
/* матрица: кружок уровня с делениями — вид из прототипа */
@property --p{syntax:'<number>';initial-value:0;inherits:false}
.hb{--p:0;display:inline-block;width:22px;height:22px;border-radius:50%;border:1.5px solid #B9BFCB;flex:none;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),#fff 0);transition:--p .35s ease,transform .15s}
.hb:after{content:"";position:absolute}
.hb.core{outline:2px solid var(--accent);outline-offset:3px}
.hb.none{width:6px;height:6px;border:0;background:#DCDFE5;outline:none}
.mxwrap{background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:6px 0;overflow:hidden}
.mxr{display:grid;grid-template-columns:230px repeat(var(--n),1fr) 150px;align-items:center;min-height:44px;padding:0 14px;transition:background .15s}
.mxr:not(.mxhead):hover{background:#FAFAFB}
.mxr:not(.mxhead):hover .hb:not(.none){transform:scale(1.12)}
.mxhead{min-height:56px;border-bottom:1px solid var(--border);color:var(--usual);font-size:11.5px;font-weight:700}
.mxh{display:flex;align-items:center;justify-content:center;text-align:center;line-height:14px;padding:0 4px}
.mxn{font-size:13.5px;font-weight:600;padding-right:10px;line-height:17px}
.mxc{display:grid;place-items:center;height:44px}
.mxcov{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--usual);justify-content:flex-end}
.mbar{width:56px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;display:inline-block}
.mbar i{display:block;height:100%;background:var(--accent);opacity:.65}
.mxleg{display:flex;gap:20px;margin-top:14px;font-size:12.5px;color:var(--usual);align-items:center;flex-wrap:wrap}
.mxleg span{display:flex;align-items:center;gap:8px}
/* профиль */
.pcard{background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:4px 18px}
.prow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:0}
.pname{flex:1}
.pname b{display:block;font-size:15px}
.pname span{color:var(--usual);font-size:12.5px}
.pbar{display:flex;gap:4px}
.pbar i{width:26px;height:8px;border-radius:4px;background:var(--border)}
.pbar i.f{background:var(--accent)}
.pneed{color:var(--usual);font-size:12.5px;min-width:70px}
.grid2cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pbox{background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.pbox p{font-size:13.5px;line-height:19px;margin:0}
.mui .pcard{padding:2px 12px}
.mui .prow{flex-wrap:wrap;gap:8px;padding:11px 0}
.mui .pname{flex:1 1 100%}
.mui .pneed{min-width:0}

/* ---------- скилл-древо в профиле ---------- */
.treecard{background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:10px 16px 14px}
.tree{display:block;width:100%;height:470px}
.tree .br{fill:none;stroke:#DDE1E8;stroke-width:9;stroke-linecap:round}
.tree .tw{stroke:#E3E6EC;stroke-width:2}
.tree .tw.ok{stroke:#F2A7AA}
.tree .leaf{fill:#fff;stroke:#C9CED8;stroke-width:2}
.tree .leaf.ok{fill:var(--accent);stroke:var(--accent)}
.tree .leaf.track{fill:#fff;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:3 3}
.tree .leaf.skip{fill:#F1F2F6;stroke:#D7DAE1}
.tree .node{fill:var(--titles);stroke:#fff;stroke-width:3}
.tree .nlv{fill:#fff;font:700 13px Raleway;text-anchor:middle}
.tree .nname{fill:var(--titles);font:700 11.5px Raleway;stroke:#fff;stroke-width:3.5;paint-order:stroke}
.tree .root{fill:var(--accent);stroke:#fff;stroke-width:4}
.tree .rtext{fill:#fff;font:700 14px Raleway;text-anchor:middle}
.tleg{display:flex;gap:20px;font-size:12.5px;color:var(--usual);flex-wrap:wrap;padding-top:4px}
.tleg span{display:flex;align-items:center;gap:8px}
.leafdot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #C9CED8;display:inline-block}
.leafdot.ok{background:var(--accent);border-color:var(--accent)}
.leafdot.track{border-color:var(--accent);border-style:dashed}
.leafdot.skip{background:#F1F2F6;border-color:#D7DAE1}
.leafdot.node{background:var(--titles);border-color:var(--titles)}

/* ---------- кликабельный прототип: интерактив ---------- */
body.proto{background:var(--wh);margin:0}
body.proto #app{height:100vh}
body.proto .ui{height:100vh}
.content{height:100%;overflow:auto;padding:26px 0 40px;display:flex;justify-content:center}
.colwrap{width:100%;max-width:1180px;padding:0 24px}
.act{cursor:pointer}
.act:hover{filter:brightness(.96)}
.btn.off{opacity:.45;pointer-events:none}

.opt[data-opt],.shotcard[data-opt]{cursor:pointer}

.shotcard.sel{border-color:var(--titles);box-shadow:inset 0 0 0 1px var(--titles)}

.hist{color:var(--usual);font-size:13px;margin:0 0 8px}
.feed{overflow-y:auto}
.modul{height:100%}
.back2{cursor:pointer}
.btnrow .btn{cursor:pointer}

body.proto .mxn{font-size:12.5px}

/* состояния ответа в разборе шага */
.opt.ans-hit,.shotcard.ans-hit{border-color:var(--green);background:#F3FAF1}
.opt.ans-extra,.shotcard.ans-extra{border-color:var(--accent);background:#FFF4F4}

.opt.ans-hit .bx,.shotcard.ans-hit .bx{background:var(--green);border-color:var(--green);color:#fff}
.opt.ans-extra .bx,.shotcard.ans-extra .bx{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.ans-miss .bx,.shotcard.ans-miss .bx{background:var(--orange);border-color:var(--orange);color:#fff}
.optfb{display:block;color:var(--usual);font-size:12.5px;line-height:16px;margin-top:3px;font-style:normal}
.anssum{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:20px}
.anssum li{position:relative;padding-left:18px}
.anssum li:before{position:absolute;left:0;font-weight:700}
.s-hit:before{content:"✓";color:var(--green)}
.s-extra:before{content:"✕";color:var(--accent)}
.s-miss:before{content:"!";color:var(--orange)}
.legans{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--usual);flex-wrap:wrap}
.legans span{display:flex;align-items:center;gap:6px}
.legans .bx{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;border:0}
.legans .bx.hit{background:var(--green)}.legans .bx.extra{background:var(--accent)}.legans .bx.miss{background:var(--orange)}

/* ---------- библиотека компетенций ---------- */
.h3{font-size:18px;line-height:22px;margin:26px 0 12px}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lvcard{background:var(--wh);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.lvhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}

.lvhead span{color:var(--usual);font-size:12px}

.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}

.rlv{display:flex;align-items:center;gap:8px;color:var(--usual);font-size:12.5px}
.mxn.act,.mxh.act,.mxc.act{cursor:pointer}

.mxh.act:hover{color:var(--accent)}
.mcard.act{cursor:pointer;transition:border-color .15s,transform .15s}

@media (max-width:900px){.lvgrid{grid-template-columns:1fr}}
.mui .lvgrid,.mui .grid3,.mui .grid2cols{grid-template-columns:1fr}

/* ---------- скилл-древо: прорастание и наведение ---------- */
.tree .br{stroke-dasharray:420;stroke-dashoffset:420;animation:grow .7s var(--d,0s) ease forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.tree .tw{opacity:0;animation:fadein .35s var(--d,0s) ease forwards}
.tree .leaf{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s var(--d,0s) cubic-bezier(.2,1.4,.5,1) forwards}
.tree .node{opacity:0;animation:pop .4s var(--d,0s) ease forwards}
@keyframes fadein{to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.tree .brg{cursor:pointer}
.tree .brg:hover .br{stroke:#C7CCD6}
.tree .brg:hover .node{fill:var(--accent)}
.tree .brg:hover .leaf.ok{fill:#C20F17;stroke:#C20F17}
.tree .brg:hover .nname{fill:var(--accent)}
.tree .leaf{transition:r .15s}
.tree .leaf:hover{r:11}
.tree .nname,.tree .nlv,.tree .rtext{pointer-events:none}
@media (prefers-reduced-motion:reduce){.tree .br,.tree .tw,.tree .leaf,.tree .node{animation:none;opacity:1;stroke-dashoffset:0}}

/* цифра уровня в красном круге: белая и плотная, иначе на акценте не читается */
.lvcard .lvnum{color:#fff;font-weight:800;font-size:15px;width:32px;height:32px;line-height:1}
/* выравнивание подписи узла задаётся атрибутом в разметке — в CSS его не фиксируем */
.tree .nname{fill:var(--titles);font:700 11.5px Raleway;stroke:#fff;stroke-width:3.5;paint-order:stroke}

/* ---------- ветка компетенций (скилл-древо) ---------- */
.branchwrap{position:relative;width:100%;aspect-ratio:1120/400;min-height:380px}
.branch{position:absolute;inset:0;width:100%;height:100%}
.bstem{fill:none;stroke:#D7DBE3;stroke-width:7;stroke-linecap:round}
.bline{fill:none;stroke:#C9CFDA;stroke-width:2.4;stroke-dasharray:5 7;stroke-linecap:round;
  animation:dash 22s linear infinite}
@keyframes dash{to{stroke-dashoffset:-240}}
.broot{position:absolute;transform:translate(-50%,-50%);text-align:center}
.broot b{position:absolute;left:50%;top:-44px;transform:translateX(-50%);font-size:13px;color:var(--usual)}

  background:conic-gradient(var(--accent) calc(var(--p,0)*1%),#E6E9EE 0);transition:--p .6s ease}
.bring.root{position:static;width:58px;height:58px;display:inline-grid;--p:100}

  border:1px solid var(--border);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--usual)}

  border:1px solid var(--border);display:grid;place-items:center;color:var(--icons)}

.legring{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;background:conic-gradient(var(--accent) 100%,#E6E9EE 0)}
